function openCommsSheet({postId, weekIso, planId, date}){
  state.commsSheetError = '';
  if(postId){
    const p = state.commsPosts.find(x=>x.id===postId); if(!p) return;
    state.commsSheet = {isNew:false, postId, weekIso: isoDate(sundayOnOrBefore(parseISO(p.postDate))), original:{...p}, draft:{...p, planId:p.commsPlanId}};
  } else {
    const today = isoDate(new Date());
    const end = addDaysISO(weekIso, 6);
    const def = date || (today>=weekIso && today<=end ? today : weekIso);
    state.commsSheet = {isNew:true, weekIso, draft:{planId:planId||'', channel:'social', platform:'facebook,instagram', format:'post', postDate:def, endDate:'', note:'', status:'planned'}};
  }
  render();
}

// Get the plan for an item, reusing one someone else may have just created
// (item_ref_id is unique) instead of creating a duplicate.
async function getOrCreateItemPlan(key, itemType, title, needsComms){
  let plan = state.commsPlans.find(p=>p.itemRefId===key);
  if(!plan){
    const { data } = await sb.from('comms_plans').select('*').eq('item_ref_id', key).maybeSingle();
    if(data){
      plan = {id:data.id, itemType:data.item_type, itemRefId:data.item_ref_id, needsComms:data.needs_comms, autoFlowId:data.auto_flow_id, itemTitle:data.item_title||'', notes:data.notes||''};
      state.commsPlans.push(plan);
    }
  }
  if(plan){
    if(plan.needsComms !== needsComms){
      plan.needsComms = needsComms;
      const { error } = await sb.from('comms_plans').update({needs_comms:needsComms, updated_at:new Date().toISOString()}).eq('id', plan.id);
      if(error) alert('Could not save that: '+error.message);
    }
    return plan;
  }
  plan = {id:uid(), itemType, itemRefId:key, needsComms, autoFlowId:null, itemTitle:title||'', notes:''};
  state.commsPlans.push(plan);
  await saveCommsPlan(plan);
  return plan;
}

const COMMS_POST_FIELDS = [['channel','channel'],['platform','platform'],['format','format'],['postDate','post_date'],['endDate','end_date'],['note','note'],['status','status'],['commsPlanId','comms_plan_id']];
async function saveCommsSheet(){
  const cs = state.commsSheet, d = cs.draft;
  // resolve what it's for
  let planId = null;
  const forVal = d.newStandalone ? '__new__' : (d.forValue || (d.planId ? 'plan:'+d.planId : ''));
  if(forVal==='__new__'){
    const title = (d.newTitle||'').trim();
    if(!title){ state.commsSheetError = 'Say what this is for, e.g. Alpha.'; render(); return false; }
    const existing = state.commsPlans.find(p=>isStandalonePlan(p) && (p.itemTitle||'').toLowerCase()===title.toLowerCase());
    if(existing){ planId = existing.id; if(existing.needsComms===false){ await getOrCreateItemPlan(existing.itemRefId, existing.itemType, existing.itemTitle, true); } }
    else {
      const plan = {id:uid(), itemType:'event', itemRefId:'standalone::'+uid(), needsComms:true, autoFlowId:null, itemTitle:title, notes:''};
      state.commsPlans.push(plan); await saveCommsPlan(plan); planId = plan.id;
    }
  } else if(forVal.startsWith('plan:')){
    planId = forVal.slice(5);
    const pl = state.commsPlans.find(p=>p.id===planId);
    if(pl && pl.needsComms!==true) await getOrCreateItemPlan(pl.itemRefId, pl.itemType, pl.itemTitle, true);
  } else if(forVal.startsWith('item:')){
    const opt = (cs.forOptions||[]).find(o=>o.value===forVal);
    if(opt){ const plan = await getOrCreateItemPlan(opt.key, opt.type, opt.title, true); planId = plan.id; }
  }
  if(!planId){ state.commsSheetError = 'Choose what this post is for.'; render(); return false; }
  if(!d.postDate){ state.commsSheetError = 'Pick a day.'; render(); return false; }
  if(d.channel!=='social'){ d.platform=''; d.format=''; }

  const mine = {...d, commsPlanId:planId, endDate:d.endDate||null};
  if(cs.isNew){
    const post = {id:uid(), commsPlanId:planId, channel:mine.channel, platform:mine.platform, format:mine.format, postDate:mine.postDate, endDate:mine.endDate, note:mine.note||'', status:mine.status||'planned'};
    state.commsPosts.push(post);
    await saveCommsPost(post);
    return true;
  }
  // field-level, conflict-checked update
  const { data: srv, error } = await sb.from('comms_posts').select('*').eq('id', cs.postId).maybeSingle();
  if(error){ alert('Could not check this post before saving: '+error.message); return false; }
  if(!srv){ alert('This post was deleted by someone else, so your changes weren\'t saved.'); return true; }
  const o = cs.original, patch = {}, conflicts = [];
  const norm = v => v==null ? '' : String(v);
  COMMS_POST_FIELDS.forEach(([k,col])=>{
    const mv = norm(mine[k]), ov = norm(o[k]), sv = norm(srv[col]);
    if(mv===ov) return;
    if(sv!==ov && sv!==mv){ conflicts.push(k); return; }
    patch[col] = mine[k]===''&&(col==='end_date'||col==='platform'||col==='format') ? null : mine[k];
  });
  if(Object.keys(patch).length){
    const { error: upErr } = await sb.from('comms_posts').update(patch).eq('id', cs.postId);
    if(upErr){ alert('Could not save this post: '+upErr.message); return false; }
    const local = state.commsPosts.find(p=>p.id===cs.postId);
    if(local) COMMS_POST_FIELDS.forEach(([k,col])=>{ if(col in patch) local[k] = patch[col]; });
  }
  if(conflicts.length) alert('Someone else changed this post while you were editing, so their '+conflicts.join(', ').replace('postDate','date').replace('commsPlanId','"for"')+' was kept.');
  return true;
}

function attachCommsHandlers(){
  const byId = id=>document.getElementById(id);

  document.querySelectorAll('.cm-open').forEach(el=>{
    const open = ()=> openCommsSheet({postId: el.dataset.postId});

    el.onclick = async ()=>{
      const plan = state.commsPlans.find(p=>p.id===el.dataset.plan); if(!plan) return;
      plan.needsComms = null; render();
      const { error } = await sb.from('comms_plans').update({needs_comms:null, updated_at:new Date().toISOString()}).eq('id', plan.id);
      if(error) alert('Could not undo: '+error.message);

  document.querySelectorAll('.cm-mcell').forEach(el=>{ el.onclick = ()=>{ state.commsCalSelected = el.dataset.date; render(); }; });
  if(byId('cm-today')) byId('cm-today').onclick = ()=>{ const t=new Date(); state.cursor=new Date(t.getFullYear(),t.getMonth(),1); state.commsCalSelected=isoDate(t); render(); };

  // sheet
  const ov = byId('cm-sheet-overlay');
  if(ov && state.commsSheet){
    const cs = state.commsSheet, d = cs.draft;
    const re = ()=>{ syncCommsSheetFromDOM(); render(); };
    ov.onclick = (e)=>{ if(e.target===ov){ state.commsSheet=null; render(); } };
    byId('cm-cancel').onclick = ()=>{ state.commsSheet=null; render(); };
    byId('cm-for').onchange = ()=>{
      syncCommsSheetFromDOM();
      const v = byId('cm-for').value;
      d.newStandalone = v==='__new__'; d.forValue = v==='__new__' ? '' : v;
      if(v.startsWith('plan:')) d.planId = v.slice(5);
      state.commsSheetError=''; render();

    };
    document.querySelectorAll('.cm-chan-chip').forEach(el=>{ el.onclick = ()=>{ syncCommsSheetFromDOM(); d.channel = el.dataset.channel; if(d.channel==='social' && !d.platform){ d.platform='facebook,instagram'; d.format=d.format||'post'; } render(); }; });
    document.querySelectorAll('.cm-plat-chip').forEach(el=>{ el.onclick = ()=>{ syncCommsSheetFromDOM(); let pl=(d.platform||'').split(',').filter(Boolean); pl = pl.includes(el.dataset.plat) ? pl.filter(x=>x!==el.dataset.plat) : pl.concat(el.dataset.plat); d.platform = pl.join(','); render(); }; });
    document.querySelectorAll('.cm-fmt-chip').forEach(el=>{ el.onclick = ()=>{ syncCommsSheetFromDOM(); d.format = el.dataset.format; render(); }; });
    document.querySelectorAll('.cm-day').forEach(el=>{ el.onclick = ()=>{ syncCommsSheetFromDOM(); d.otherDate=false; d.postDate = el.dataset.date; render(); }; });
    byId('cm-other-day').onclick = ()=>{ syncCommsSheetFromDOM(); d.otherDate = true; render(); const i=byId('cm-date'); if(i){ i.focus(); try{ i.showPicker && i.showPicker(); }catch(e){} } };
    document.querySelectorAll('.cm-status-chip').forEach(el=>{ el.onclick = ()=>{ syncCommsSheetFromDOM(); d.status = el.dataset.status; render(); }; });
    if(byId('cm-delete')) byId('cm-delete').onclick = async ()=>{

      const o = cs.original;

        state.commsSheet=null; await loadData(); render(); return;
      }
      await deleteCommsPostRemote(cs.postId);
      state.commsPosts = state.commsPosts.filter(p=>p.id!==cs.postId);
      state.commsSheet = null; render();
    };
    byId('cm-done').onclick = async ()=>{
      syncCommsSheetFromDOM();
      const btn = byId('cm-done'); btn.disabled = true; btn.textContent = 'Saving…';
      const ok = await saveCommsSheet();
      if(ok){ state.commsSheet = null; render(); }
      else if(btn){ btn.disabled = false; btn.textContent = cs.isNew?'Add':'Done'; }
    };
  }
}

// ---------- ChurchSuite calendar CSV export ----------
// Produces a CSV using ChurchSuite's documented import column headers (name, datetime_start,
// datetime_end, category, description, status) so it can be uploaded directly via
// Calendar module -> Events -> Import events. Category is the item's audience (e.g. "Leadership",
// "Connections", "Worship") so it must already exist as a Category in ChurchSuite with a matching
// name, or it'll show as unmapped in their import preview step. Where an item has more than one
// tag, the first tag's audience is used as the category (same convention the app already uses for
// pill colouring). ChurchSuite's accepted status values are pending/confirmed/cancelled, so our
// 'declined' items map to their 'cancelled' — they're included, not dropped, so Core Team sees
// them reflected as cancelled rather than silently missing.
const CHURCHSUITE_STATUS = {confirmed:'confirmed', pending:'pending', declined:'cancelled'};
function churchSuiteCSVRows(){
  const ws = visibleWeeks();
  const rows = [['name','datetime_start','datetime_end','category','description','status']];
  ws.forEach(wk=>{
    if(wk.sundayDate){
      rows.push([wk.occasion || wk.sundaySeries || 'Sunday Service', wk.sundayDate, '', 'Sunday Service', wk.sundaySeries||'', 'confirmed']);
    }
    effectiveMidweek(wk).forEach(m=>{
      const tags = (m.tagIds||[]).map(tagById).filter(Boolean);
      if(!tags.length) return;
      rows.push([tags.map(t=>t.name).join(' + '), m.date || wk.weekCommencing || '', '', itemAudience(m,tags), m.note||'', CHURCHSUITE_STATUS[m.status||'confirmed']]);
    });
    effectivePostService(wk).forEach(m=>{
      const tags = (m.tagIds||[]).map(tagById).filter(Boolean);
      if(!tags.length) return;
      rows.push([tags.map(t=>t.name).join(' + '), m.date || wk.sundayDate || '', '', itemAudience(m,tags), m.note||'', CHURCHSUITE_STATUS[m.status||'confirmed']]);
    });
  });
  return rows;
}
function toCSV(rows){
  return rows.map(r=>r.map(v=>{
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
}

function attachLoginHandlers(){
  const saveBtn = document.getElementById('save-user');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const name = document.getElementById('new-name').value.trim();
      const pin = document.getElementById('new-pin').value.trim();
      const err = document.getElementById('add-error');
      if(!name){ err.textContent='Enter a name.'; return; }
      if(!/^\d{4}$/.test(pin)){ err.textContent='PIN must be 4 digits.'; return; }
      const user = {id:uid(), name, pin};
      state.users.push(user);
      await saveUsers(user);
      state.currentUser = user;
      state.loginStep = 'pick';
      render();
    };
  }
  const cancelAdd = document.getElementById('cancel-add');
  if(cancelAdd) cancelAdd.onclick = ()=>{ state.loginStep='pick'; render(); };

  const addNew = document.getElementById('add-new-user');
  if(addNew) addNew.onclick = ()=>{ state.loginStep='add'; render(); };

  document.querySelectorAll('.user-chip').forEach(el=>{
    el.onclick = ()=>{
      state.pendingUser = state.users.find(u=>u.id===el.dataset.id);
      state.loginStep = 'pin'; state.pinBuffer=''; state.pinError='';
      render();
    };
  });

  document.querySelectorAll('.pin-key').forEach(el=>{
    el.onclick = ()=>{
      if(state.pinBuffer.length>=4) return;
      state.pinBuffer += el.dataset.n;
      if(state.pinBuffer.length===4){
        if(state.pinBuffer === state.pendingUser.pin){
          state.currentUser = state.pendingUser;
          state.pendingUser=null; state.loginStep='pick'; state.pinBuffer='';
          render();
        } else {
          state.pinError = 'Wrong PIN, try again.';
          state.pinBuffer='';
          render();
        }
      } else render();
    };
  });
  const back = document.getElementById('pin-back');
  if(back) back.onclick = ()=>{ state.pinBuffer = state.pinBuffer.slice(0,-1); render(); };
  const notYou = document.getElementById('not-you');
  if(notYou) notYou.onclick = ()=>{ state.pendingUser=null; state.loginStep='pick'; state.pinError=''; render(); };
}

// ---------- Calendar + Look Ahead ----------
// Both views share one item row: status dot, name (+ cleaned note, ↻ for
// recurring), "Needs approval" spelled out only when it applies, and a quiet meta
// line (time · audience · owner). Sundays are headings for their week, not pills.
// Tapping a week item opens that week in the editor.
function calPasses(o){
  if(o.ev.id && o.ev.id.startsWith('wk-sun-')) return true;
  if(state.statusFilter && state.statusFilter!=='all' && o.ev.status !== state.statusFilter) return false;
  if(state.audFilter && o.ev.audience !== state.audFilter) return false;
  return true;
}
function calFiltering(){ return (state.statusFilter && state.statusFilter!=='all') || !!state.audFilter; }

function calItemHTML(o, opts){
  const ev = o.ev;
  const isWeekItem = !!ev.weekId;
  const s = ev.status || '';
  const dot = s ? STATUS_COLOR[s] : 'var(--ink-soft)';
  const name = ev.name || ev.title;
  const note = ev.name ? cleanNote(ev.note, ev.name) : '';
  const metaParts = [
    (opts && opts.showKind && ev.kind==='ps') ? 'After service' : '',
    ev.time || '', ev.audience || (!isWeekItem && CATS[ev.category] ? CATS[ev.category].label : ''), ev.owner || ''
  ].filter(Boolean);
  return `<div class="cal-item${s==='declined'?' declined':''}" data-id="${ev.id}" data-week="${ev.weekId||''}" role="button" tabindex="0">
    <span class="cal-dot" style="background:${dot};"></span>
    <div class="cal-item-main">
      <span class="cal-item-name">${escHTML(name)}${ev.recurring?' <span class="we-rec">↻</span>':''}${note?`<span class="we-note"> — ${escHTML(note)}</span>`:''}</span>${s==='pending'?' <span class="cal-flag">Needs approval</span>':''}${s==='declined'?' <span class="cal-flag red">Cancelled</span>':''}
      ${metaParts.length ? `<span class="cal-item-meta">${metaParts.map(escHTML).join(' · ')}</span>` : ''}
    </div>
  </div>`;
}

// Month grid (Mon–Sun). Desktop/tablet: one line per item with a status-coloured
// bar, the name truncated with "…" and the start time — fixed equal columns via
// minmax(0,1fr) so long titles can never stretch the grid. Phone: compact grid
// with status dots; tapping a day lists its items underneath.
const MG_MAX = 4;
function calendarHTML(){
  const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
  const first = new Date(y, m, 1);
  const offset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const weeks = Math.ceil((offset + daysInMonth)/7);
  const gridStart = new Date(y, m, 1-offset);
  const cells = [];
  for(let i=0;i<weeks*7;i++) cells.push(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i));
  const occ = eventsForRange(cells[0], cells[cells.length-1]);
  const byDay = {};
  occ.forEach(o=>{ const k=isoDate(o.date); (byDay[k]=byDay[k]||[]).push(o); });
  const today = isoDate(new Date());
  const dayData = k=>{
    const all = byDay[k] || [];
    const sunday = all.find(o=> o.ev.id.startsWith('wk-sun-'));
    const items = all.filter(o=> !o.ev.id.startsWith('wk-sun-') && calPasses(o));
    const wk = sunday ? state.weeks.find(w=>w.id===sunday.ev.weekId) : null;
    return {sunday, items, wk};
  };
  const inMonth = k=> k.slice(0,7) === `${y}-${String(m+1).padStart(2,'0')}`;
  if(!state.calSelected || !inMonth(state.calSelected)) state.calSelected = inMonth(today) ? today : isoDate(first);

  const evLine = o=>{
    const ev = o.ev, s = ev.status||'';
    const name = (ev.name || ev.title) + (ev.recurring ? ' ↻' : '');
    const t = (ev.time||'').split('–')[0];
    const tip = [ev.name||ev.title, s?STATUSES[s].label:'', ev.audience||'', ev.owner||''].filter(Boolean).join(' · ');
    return `<div class="mg-ev${s==='declined'?' declined':''}" data-id="${ev.id}" data-week="${ev.weekId||''}" role="button" tabindex="0" title="${escHTML(tip)}">
      <span class="mg-bar" style="background:${s?STATUS_COLOR[s]:'var(--ink-soft)'};"></span>
      <span class="mg-name">${escHTML(name)}</span>${t?`<span class="mg-time">${t}</span>`:''}
    </div>`;
  };

  const dows = DOW.map(d=>`<div class="mg-dow">${d}</div>`).join('');
  const desk = cells.map(d=>{
    const k = isoDate(d), {sunday, items, wk} = dayData(k);
    const expanded = state.calExpanded === k;
    const shown = expanded ? items : items.slice(0, MG_MAX - (sunday?1:0));
    const extra = items.length - shown.length;
    return `<div class="mg-cell${inMonth(k)?'':' out'}${d.getDay()===0?' sun':''}">
      <div class="mg-num${k===today?' today':''}"><span>${d.getDate()===1?d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3):d.getDate()}</span></div>
      ${sunday ? `<div class="mg-sun" data-week="${sunday.ev.weekId}" role="button" tabindex="0" title="${escHTML((wk&&wk.sundaySeries)||'')}">${escHTML((wk && (wk.occasion || wk.sundaySeries)) || 'Sunday')}</div>` : ''}
      ${shown.map(evLine).join('')}
      ${extra>0 ? `<button type="button" class="mg-more" data-day="${k}">+${extra} more</button>` : ''}
      ${(expanded && items.length > MG_MAX-(sunday?1:0)) ? `<button type="button" class="mg-more" data-day="">Show less</button>` : ''}
    </div>`;
  }).join('');

  const mob = cells.map(d=>{
    const k = isoDate(d), {sunday, items} = dayData(k);
    return `<div class="mg-mcell${inMonth(k)?'':' out'}${d.getDay()===0?' sun':''}${k===today?' today':''}${k===state.calSelected?' sel':''}" data-date="${k}" role="button" tabindex="0" aria-label="${fmtDate(k)}, ${items.length} item${items.length===1?'':'s'}">
      <div class="mg-mnum">${d.getDate()}</div>
      <div class="mg-dots">${items.slice(0,3).map(o=>`<i style="background:${o.ev.status?STATUS_COLOR[o.ev.status]:'var(--ink-soft)'};"></i>`).join('')}${(!items.length && sunday)?'<i style="background:var(--navy);opacity:.35;"></i>':''}</div>
    </div>`;
  }).join('');

  const sel = dayData(state.calSelected);
  const selDate = parseISO(state.calSelected);
  const dayList = `<div class="mg-daylist">
    <div class="mg-dayhead">${DOW[(selDate.getDay()+6)%7]} ${selDate.getDate()} ${MONTHS[selDate.getMonth()]}${state.calSelected===today?' · Today':''}</div>
    ${sel.sunday ? `<div class="cal-sun" style="margin-top:6px;">
        <div class="cal-sun-head" data-week="${sel.sunday.ev.weekId}" role="button" tabindex="0">
          <div class="cal-sun-title">${escHTML((sel.wk && sel.wk.sundaySeries) || 'Untitled Sunday')}${sel.wk && sel.wk.occasion ? ` <span class="wk2-occ">${escHTML(sel.wk.occasion)}</span>` : ''}</div>
        </div>
        ${sel.items.length ? `<div class="cal-items">${sel.items.map(o=>calItemHTML(o)).join('')}</div>` : `<div class="cal-none">Nothing after the service</div>`}
      </div>`
      : (sel.items.length ? `<div class="cal-items">${sel.items.map(o=>calItemHTML(o)).join('')}</div>` : `<div class="cal-none">Nothing planned${calFiltering()?' that matches the filter':''}</div>`)}
  </div>`;

  return `
    <div class="mg-top">
      ${calFiltering() ? `<span class="mg-filtnote">Showing filtered items only</span>` : '<span></span>'}
      <button type="button" class="btn" id="cal-today">Today</button>
    </div>
    <div class="mg-desk"><div class="mg">${dows}${desk}</div></div>
    <div class="mg-mob"><div class="mg">${DOW.map(d=>`<div class="mg-dow">${d[0]}</div>`).join('')}${mob}</div>${dayList}</div>`;
}

// Look Ahead: six months as a stack of week cards. Each card is one Sunday
// (date block, series, occasion, a one-line summary of what needs chasing) with
// that week's items listed inside — after-service items labelled as such, the
// rest by day. Items whose Sunday falls in the previous month carry on under a
// "continued" card so nothing is orphaned.
function listHTML(){
  const rangeStart = new Date(state.cursor.getFullYear(), state.cursor.getMonth(), 1);
  const rangeEnd = new Date(state.cursor.getFullYear(), state.cursor.getMonth()+6, 0);
  const occ = eventsForRange(rangeStart, rangeEnd);
  const filtering = calFiltering();
  const today = isoDate(new Date());
  const thisWeek = state.weeks.find(isCurrentWeek);

  // month -> ordered list of cards
  const months = {};
  const cardFor = (mKey, key, make)=>{
    const m = months[mKey] = months[mKey] || {cards:[], byKey:{}};
    if(!m.byKey[key]){ m.byKey[key] = make(); m.cards.push(m.byKey[key]); }
    return m.byKey[key];
  };
  occ.forEach(o=>{
    const mKey = `${o.date.getFullYear()}-${String(o.date.getMonth()).padStart(2,'0')}`;
    const isSun = o.ev.id.startsWith('wk-sun-');
    if(isSun){
      cardFor(mKey, 'wk:'+o.ev.weekId, ()=>({weekId:o.ev.weekId, sunDate:o.date, items:[]}));
      return;
    }
    if(!calPasses(o)) return;
    const key = o.ev.weekId ? 'wk:'+o.ev.weekId : 'day:'+isoDate(o.date);
    const card = cardFor(mKey, key, ()=>({weekId:o.ev.weekId||null, sunDate:null, firstDate:o.date, items:[]}));
    card.items.push(o);
  });

  const cardHTML = c=>{
    const wk = c.weekId ? state.weeks.find(w=>w.id===c.weekId) : null;
    const pending = c.items.filter(o=>o.ev.status==='pending').length;
    const cancelled = c.items.filter(o=>o.ev.status==='declined').length;
    const isNow = wk && thisWeek && wk.id===thisWeek.id;
    const summary = [
      `${c.items.length} item${c.items.length===1?'':'s'}`,
      pending ? `<b class="la-amber">${pending} need${pending===1?'s':''} approval</b>` : '',
      cancelled ? `<b class="la-red">${cancelled} cancelled</b>` : ''
    ].filter(Boolean).join(' · ');
    let head;
    if(c.sunDate){
      head = `<div class="la-wdate"><span>Sun</span><b>${c.sunDate.getDate()}</b></div>
        <div class="la-whead-main">
          <div class="la-wtitle${wk && wk.sundaySeries?'':' untitled'}">${escHTML((wk && wk.sundaySeries) || 'Untitled Sunday')}${wk && wk.occasion ? ` <span class="wk2-occ">${escHTML(wk.occasion)}</span>` : ''}</div>
          <div class="la-wsum">${isNow?'<b class="la-now">This week</b> · ':''}${summary}</div>
        </div>`;
    } else {
      const sd = wk && wk.sundayDate ? fmtDate(wk.sundayDate) : '';
      head = `<div class="la-wdate cont"><span>${DOW[(c.firstDate.getDay()+6)%7]}</span><b>${c.firstDate.getDate()}</b></div>
        <div class="la-whead-main">
          <div class="la-wtitle">${wk ? 'Continued from '+sd : 'Other dates'}</div>
          <div class="la-wsum">${summary}</div>
        </div>`;
    }
    const rows = c.items.map(o=>{
      const isPs = o.ev.kind==='ps' && wk && isoDate(o.date)===wk.sundayDate;
      const lbl = isPs ? 'After service' : `${DOW[(o.date.getDay()+6)%7]} ${o.date.getDate()}`;
      return `<div class="la-row${isoDate(o.date)===today?' today':''}"><span class="la-date">${lbl}</span>${calItemHTML(o)}</div>`;
    }).join('');
    return `<div class="la-week${isNow?' now':''}">
      <div class="la-whead" ${c.weekId?`data-week="${c.weekId}" role="button" tabindex="0"`:''}>${head}<span class="wk2-chev" aria-hidden="true">›</span></div>
      ${rows ? `<div class="la-items">${rows}</div>` : `<div class="la-empty">Nothing planned</div>`}
    </div>`;
  };

  const out = Object.keys(months).sort().map(mKey=>{
    const [y,m] = mKey.split('-').map(Number);
    let cards = months[mKey].cards;
    if(filtering) cards = cards.filter(c=>c.items.length);
    if(!cards.length) return '';
    return `<div class="la-month">
      <div class="la-month-head">
        <h3>${MONTHS[m]} ${y}</h3>
        <button class="export-pdf-month" type="button" data-year="${y}" data-month="${m}">Export PDF</button>
      </div>
      ${cards.map(cardHTML).join('')}
    </div>`;
  }).join('');
  if(!out.trim()) return `<div class="empty">${filtering ? 'Nothing matches this filter.' : 'Nothing planned in these six months yet.'}</div>`;
  return `<div class="cal-wrap">${out}</div>`;
}

function calFiltersHTML(){
  const f = state.statusFilter || 'all';
  const auds = state.audiences.map(a=>a.name);
  return `<div class="cal-filters">
    ${[['all','All'],['pending','Needs approval'],['declined','Cancelled']].map(([k,l])=>`<button type="button" class="cal-chip ${f===k?'on':''}" data-status="${k}">${k!=='all'?`<span class="cal-dot" style="background:${STATUS_COLOR[k]};"></span>`:''}${l}</button>`).join('')}
    <select id="cal-aud" aria-label="Filter by audience">

}

const RHYTHM_SUGGESTIONS = ['Small Group','Prayer','Margin Week','Team Development','Meetings Week','Alpha'];

function visibleWeeks(){
  let ws = state.weeks.slice().sort((a,b)=> a.sundayDate < b.sundayDate ? -1 : 1);
  ws = ws.filter(w=> w.sundayDate && churchYearOf(parseISO(w.sundayDate))===state.churchYear);
  if(state.termFilter) ws = ws.filter(w=> termOf(parseISO(w.sundayDate))===state.termFilter);
  return ws;
}

function fmtDate(iso){
  if(!iso) return '';
  const d = parseISO(iso);
  return `${DOW[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
}

// ---------- Week editor: compact rows + bottom-sheet add/edit ----------
// Every activity in the week editor is a single tappable line (audience colour bar,
// name, day/time, and status only when it isn't the default "Confirmed"). Adding or
// editing happens in one focused bottom sheet that works on a draft copy, so nothing
// in the week changes until "Add"/"Done" is pressed — and nothing is saved to
// Supabase until "Save week", exactly as before.
function escHTML(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function addDaysISO(iso, n){ const d = parseISO(iso); return isoDate(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n)); }
const TRASH_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

function editorDefaultDate(section){
  const sun = state.editingWeekDraft && state.editingWeekDraft.sundayDate;
  if(!sun) return '';
  return section==='postService' ? sun : addDaysISO(sun, 1);
}

// Owner shown/used for an item: its own pick for that week, else the activity's
// default owner from Settings (which is how recurring items get an owner too).
function effectiveOwner(m, tags){
  if(m.owner) return m.owner;
  const t = (tags||[])[0];
  return (t && t.defaultOwner) || '';
}
// Notes often repeat the activity name ("Creative - 30th Sep") — strip that so
// only the useful part shows.
function cleanNote(note, name){
  let n = (note||'').trim();
  if(!n) return '';
  if(name && n.toLowerCase().startsWith(name.toLowerCase())) n = n.slice(name.length).replace(/^[\s\-–—:,]+/, '');
  return n;
}
const STATUS_COLOR = {confirmed:'var(--tl-green)', pending:'var(--tl-amber)', declined:'var(--tl-red)'};

function editorRowsHTML(rows, section){
  if(!rows.length) return `<div class="we-empty">Nothing yet</div>`;
  const defaultDate = editorDefaultDate(section);
  return rows.map(r=>{
    const tags = (r.tagIds||[]).map(tagById).filter(Boolean);
    const name = tags.length ? tags.map(t=>t.name).join(' + ') : 'Untitled activity';
    const aud = itemAudience(r, tags) || '';
    const s = r.status || 'confirmed';
    const whenIso = r.date || defaultDate;
    const isDefaultDay = !r.date || r.date === defaultDate;
    const when = whenIso ? (isDefaultDay ? DOW[(parseISO(whenIso).getDay()+6)%7] : fmtDate(whenIso)) : '';
    const time = (r.allDay===false && r.startTime) ? ' '+r.startTime+(r.endTime?'–'+r.endTime:'') : '';
    const owner = effectiveOwner(r, tags);
    const note = cleanNote(r.note, name);
    const meta = [
      when + time, aud, owner,
      s!=='confirmed' ? `<span style="color:${STATUS_COLOR[s]};font-weight:700;">${STATUSES[s].label}</span>` : '',
      r.needsComms===true ? 'Needs comms' : '',
      r.repeatFreq ? 'Will repeat' : ''
    ].filter(Boolean).map(x=> x.startsWith('<span') ? x : escHTML(x)).join(' · ');
    return `<div class="we-row${r.recurringId?' recurring':''}" data-mwid="${r.id}" data-section="${section}" role="button" tabindex="0" aria-label="${escHTML(name)}, ${STATUSES[s].label}">
      <span class="we-sdot" style="background:${STATUS_COLOR[s]};" title="${STATUSES[s].label}"></span>
      <div class="we-body">
        <div class="we-name">${escHTML(name)}${r.recurringId?'<span class="we-rec"> ↻</span>':''}${note?`<span class="we-note"> — ${escHTML(note)}</span>`:''}</div>
        <div class="we-meta">${meta}</div>
      </div>
      <span class="we-chev" aria-hidden="true">›</span>
    </div>`;
  }).join('');
}

// Captures anything typed in the open sheet into its draft before a re-render,
// so a chip tap or a realtime refresh never wipes what's been typed.
function syncSheetFromDOM(){
  const d = state.sheetDraft;
  if(!state.sheet || !d) return;
  const v = id => document.getElementById(id);
  if(v('sh-newtag-name')) d.newTagName = v('sh-newtag-name').value;
  if(v('sh-date')) d.date = v('sh-date').value;
  if(v('sh-start')){ d.startTime = v('sh-start').value; d.allDay = !d.startTime; }
  if(v('sh-end')) d.endTime = v('sh-end').value;
  if(v('sh-note')) d.note = v('sh-note').value;
  if(v('sh-aud')) d.audience = v('sh-aud').value;
  if(v('sh-owner')) d.owner = v('sh-owner').value;
  if(v('sh-repeat')) d.repeatFreq = v('sh-repeat').value;
}

function closeSheet(){ state.sheet = null; state.sheetDraft = null; state.sheetError = ''; state.sheetMore = false; }

function removeEditorRow(id){
  const {entry, section} = findEditingRow(id);
  if(!entry) return;
  const arrName = section==='midweek' ? 'editingMidweekRows' : 'editingPostServiceRows';
  const idx = state[arrName].findIndex(r=>r.id===id);
  state[arrName].splice(idx, 1);
  state.lastRemoved = {arrName, idx, entry};
  clearTimeout(window.__undoTimer);
  window.__undoTimer = setTimeout(()=>{
    state.lastRemoved = null;
    const t = document.getElementById('undo-toast'); if(t) t.remove();
  }, 7000);
}

function clearWeekEditing(){
  state.editingWeekId = null;
  state.editingMidweekRows = null; state.editingPostServiceRows = null;
  state.editingOriginalRecurringIds = null; state.editingOriginalPostServiceRecurringIds = null;
  state.editingWeekDraft = null; state.weekMenuOpen = false; state.lastRemoved = null; state.detailsOpen = false; state.editingOriginal = null;
  closeSheet();
}

function undoToastHTML(){
  if(!state.lastRemoved || !state.editingWeekId) return '';
  const r = state.lastRemoved.entry;
  const tags = (r.tagIds||[]).map(tagById).filter(Boolean);
  const name = tags.length ? tags.map(t=>t.name).join(' + ') : 'activity';
  return `<div class="undo-toast" id="undo-toast" role="status"><span>Removed "${escHTML(name)}"</span><button type="button" id="undo-remove">Undo</button></div>`;

        <div class="full"><label>Sunday series</label><input data-field="sundaySeries" value="${escHTML(draft.sundaySeries)}" placeholder="Sermon series title"></div>

// A week "is now" from its Sunday through the following Saturday.
function isCurrentWeek(wk){
  if(!wk.sundayDate) return false;
  const today = isoDate(new Date());
  return wk.sundayDate <= today && today <= addDaysISO(wk.sundayDate, 6);
}
function isPastWeek(wk){
  return !!wk.sundayDate && addDaysISO(wk.sundayDate, 6) < isoDate(new Date());
}

function dashboardHTML(){
  const ws = visibleWeeks();
  const draftDate = (()=>{
    const today = new Date();
    if(churchYearOf(today)===state.churchYear && (!state.termFilter || termOf(today)===state.termFilter)) return isoDate(today);
    const [start] = termDateRangeForYear(state.termFilter || 'autumn', state.churchYear);
    return isoDate(start);
  })();
  const newDraft = state.editingWeekId==='new' ? weekCardHTML({id:'new',occasion:'',sundayDate:draftDate,sundaySeries:'',weekCommencing:'',happening:'',midweek:[],postService:[],excludedRecurring:[]}, ws.length) : '';

  // Past weeks fold away in the current church year only (a past year would fold
  // everything). The week being edited always stays visible.
  const isCurrentYear = state.churchYear === churchYearOf(new Date());
  const past = isCurrentYear ? ws.filter(w=> isPastWeek(w) && w.id!==state.editingWeekId) : [];
  const shown = (past.length && !state.showPastWeeks) ? ws.filter(w=> !past.includes(w)) : ws;
  const nowWeek = ws.find(isCurrentWeek);

  let cards = '', lastMonth = '';
  shown.forEach(w=>{
    const i = ws.indexOf(w);
    const d = parseISO(w.sundayDate);
    const mKey = `${d.getFullYear()}-${d.getMonth()}`;
    if(mKey !== lastMonth){
      const count = shown.filter(x=>{ const xd = parseISO(x.sundayDate); return xd.getFullYear()===d.getFullYear() && xd.getMonth()===d.getMonth(); }).length;
      cards += `<div class="dash-month"><span class="dash-month-name">${MONTHS[d.getMonth()]} ${d.getFullYear()}</span><span class="dash-month-count">${count} Sunday${count===1?'':'s'}</span></div>`;
      lastMonth = mKey;
    }
    cards += weekCardHTML(w, i);
  });

  return `
    <div class="dash-toolbar">
      <div class="term-label">${ws.length} week${ws.length===1?'':'s'}${state.termFilter?' · '+state.termFilter:' · all terms'} · ${churchYearLabel(state.churchYear)}</div>
      <div class="dash-actions">
        <button type="button" class="dash-menu-btn" id="dash-menu-btn" aria-label="More options" aria-expanded="${state.dashMenuOpen?'true':'false'}">⋯</button>
        ${state.dashMenuOpen ? `<div class="dash-menu">
          <button type="button" id="fill-weeks">Fill ${state.termFilter?state.termFilter+' '+churchYearLabel(state.churchYear):'term'}'s Sundays</button>
          <button type="button" id="export-churchsuite">Export ChurchSuite CSV</button>
        </div>` : ''}
        <button class="add-btn" id="add-week">+ Add week</button>
      </div>
    </div>
    <div class="status-legend"><span><i style="background:var(--tl-green)"></i>Confirmed</span><span><i style="background:var(--tl-amber)"></i>Needs approval</span><span><i style="background:var(--tl-red)"></i>Cancelled</span></div>
    ${nowWeek && !state.editingWeekId ? `<button type="button" class="jump-now" id="jump-now" data-id="${nowWeek.id}">↓ Jump to this week</button>` : ''}
    ${past.length ? `<button type="button" class="show-earlier" id="toggle-past">${state.showPastWeeks ? 'Hide earlier weeks' : `Show ${past.length} earlier week${past.length===1?'':'s'}`}</button>` : ''}
    <div class="weeks-timeline">
      ${ws.length ? cards : (state.editingWeekId!=='new' ? `<div class="empty">No weeks on the rhythm yet.<br>Use ⋯ → "Fill term's Sundays" to auto-create them, or "+ Add week" for just one.</div>` : '')}
      ${newDraft}
    </div>
  `;
}

// ---------- Owners ----------
const DEFAULT_OWNERS = ['Jonny','Amy','Ed','Marvelous','Dan','Dimeji','Becky','Stanley'];
function ownerInitials(name){
  const parts = String(name).trim().split(/\s+/);
  return ((parts[0]||'')[0]||'').toUpperCase() + ((parts[1]||parts[0]||'')[parts[1]?0:1]||'').toUpperCase();
}
// Every after-service/midweek item in the current year + term scope that has an
// owner (its own, or its activity's default), grouped by owner.
function ownersTabHTML(){
  const ws = visibleWeeks();
  const byOwner = {};
  ws.forEach(wk=>{
    const add = (m, kind, anchor)=>{
      const tags = (m.tagIds||[]).map(tagById).filter(Boolean);
      if(!tags.length) return;
      const owner = effectiveOwner(m, tags);
      if(!owner) return;
      (byOwner[owner] = byOwner[owner]||[]).push({
        weekId: wk.id, date: m.date || anchor, kind, status: m.status||'confirmed',
        title: (()=>{ const nm = tags.map(t=>t.name).join(' + '); const n = cleanNote(m.note, nm); return nm + (n ? ' — '+n : '') + (m.recurringId ? ' ↻' : ''); })(),
        audience: itemAudience(m, tags)
      });
    };
    effectivePostService(wk).forEach(m=> add(m, 'After service', wk.sundayDate));
    effectiveMidweek(wk).forEach(m=> add(m, 'Midweek', wk.weekCommencing || wk.sundayDate));
  });
  const scope = `${state.termFilter ? state.termFilter[0].toUpperCase()+state.termFilter.slice(1) : 'All terms'} · ${churchYearLabel(state.churchYear)} · items with no owner aren't listed`;
  const order = state.owners.map(o=>o.name);
  const names = Object.keys(byOwner).sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if(ia>-1 && ib>-1) return ia-ib;
    if(ia>-1) return -1; if(ib>-1) return 1;
    return a.localeCompare(b);
  });
  if(!names.length) return `<div class="own-scope">${scope}</div><div class="empty">No owners set yet.<br>Open a week, tap an activity and pick an owner.</div>`;
  return `<div class="own-scope">${scope}</div>` + names.map(n=>{
    const items = byOwner[n].sort((a,b)=> (a.date||'') < (b.date||'') ? -1 : 1);
    const pending = items.filter(i=>i.status==='pending').length;
    return `<div class="own-card">
      <div class="own-head">
        <span class="own-av">${escHTML(ownerInitials(n))}</span>
        <span class="own-name">${escHTML(n)}</span>
        <span class="own-count">${items.length} item${items.length===1?'':'s'}${pending?` · <b>${pending} need${pending===1?'s':''} approval</b>`:''}</span>
      </div>
      ${items.map(i=>`
        <div class="own-item" data-week-id="${i.weekId}" role="button" tabindex="0">
          <div class="own-item-main">
            <div class="own-item-title">${escHTML(i.title)}</div>
            <div class="own-item-meta">${i.date ? fmtDate(i.date) : ''} · ${i.kind}${i.audience ? ' · '+escHTML(i.audience) : ''}</div>
          </div>
          <span class="st-pill ${i.status}">${STATUSES[i.status].label}</span>
        </div>`).join('')}
    </div>`;
  }).join('');
}

function attachMainHandlers(){
  const reloadApp = document.getElementById('reload-app');
  if(reloadApp) reloadApp.onclick = ()=> location.reload();
  document.getElementById('switch-user').onclick = ()=>{ state.currentUser=null; render(); };
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{
      const t = el.dataset.term;
      state.termFilter = state.termFilter===t ? null : t;
      render();
    };
  });
  const prevYearBtn = document.getElementById('prev-church-year');
  if(prevYearBtn) prevYearBtn.onclick = ()=>{ state.churchYear--; render(); };
  const nextYearBtn = document.getElementById('next-church-year');
  if(nextYearBtn) nextYearBtn.onclick = ()=>{ state.churchYear++; render(); };
  document.querySelectorAll('.view-toggle button').forEach(el=>{
    el.onclick = ()=>{ state.view = el.dataset.view; render(); };
  });
  const prevBtn = document.getElementById('prev-month');
  const nextBtn = document.getElementById('next-month');
  if(prevBtn) prevBtn.onclick = ()=>{
    const step = (state.view==='calendar' || state.view==='comms')?1:6;
    state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth()-step, 1);
    render();
  };
  if(nextBtn) nextBtn.onclick = ()=>{
    const step = (state.view==='calendar' || state.view==='comms')?1:6;
    state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth()+step, 1);
    render();
  };
  document.querySelectorAll('.cal-chip').forEach(el=>{
    el.onclick = ()=>{ state.statusFilter = el.dataset.status; render(); };
  });
  const calAud = document.getElementById('cal-aud');
  if(calAud) calAud.onchange = ()=>{ state.audFilter = calAud.value; render(); };
  document.querySelectorAll('.mg-more').forEach(el=>{
    el.onclick = ()=>{ state.calExpanded = el.dataset.day || null; render(); };
  });
  document.querySelectorAll('.mg-mcell').forEach(el=>{
    const pick = ()=>{
      const k = el.dataset.date, d = parseISO(k);
      state.calSelected = k;
      if(d.getMonth()!==state.cursor.getMonth() || d.getFullYear()!==state.cursor.getFullYear()) state.cursor = new Date(d.getFullYear(), d.getMonth(), 1);
      render();
    };
    el.onclick = pick;
    el.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pick(); } };
  });
  const calToday = document.getElementById('cal-today');
  if(calToday) calToday.onclick = ()=>{
    const t = new Date();
    state.cursor = new Date(t.getFullYear(), t.getMonth(), 1);
    state.calSelected = isoDate(t); state.calExpanded = null;
    render();
  };
  const calClear = document.getElementById('cal-clear');
  if(calClear) calClear.onclick = ()=>{ state.statusFilter = 'all'; state.audFilter = ''; render(); };
  const openAdd = document.getElementById('open-add');
  if(openAdd) openAdd.onclick = ()=>{
    state.editingEvent = null; state.showModal = true; render();
  };
  // Week items and Sunday headings open that week in the editor; standalone
  // planner events still open their own modal.
  document.querySelectorAll('.cal-item, .cal-sun-head, .la-sun, .la-whead[data-week], .mg-ev, .mg-sun').forEach(el=>{
    const go = ()=>{
      if(el.dataset.week){ state.view = 'dashboard'; openWeekEditor(el.dataset.week); return; }
      const ev = state.events.find(e=>e.id===el.dataset.id);
      if(ev){ state.editingEvent = {...ev}; state.showModal = true; render(); }
    };
    el.onclick = go;
    el.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } };
  });
  if(state.view==='dashboard') attachDashboardHandlers();
  if(state.view==='comms') attachCommsHandlers();
  if(state.view==='owners'){
    document.querySelectorAll('.own-item').forEach(el=>{
      const go = ()=>{ state.view = 'dashboard'; openWeekEditor(el.dataset.weekId); };
      el.onclick = go;
      el.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } };
    });
  }
  const exportCsvBtn = document.getElementById('export-churchsuite');
  if(exportCsvBtn) exportCsvBtn.onclick = ()=>{
    const csv = toCSV(churchSuiteCSVRows());
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

// Reads any in-progress typing in the midweek rows back into state.editingMidweekRows
// before we mutate the row list and re-render, so nothing typed gets lost.
// A row's id is unique regardless of which section it belongs to, so we can find it
// by searching both editing arrays rather than needing to inspect the DOM for section.
function findEditingRow(id){
  let entry = (state.editingMidweekRows||[]).find(r=>r.id===id);
  if(entry) return {entry, section:'midweek'};
  entry = (state.editingPostServiceRows||[]).find(r=>r.id===id);
  if(entry) return {entry, section:'postService'};
  return {entry:null, section:null};
}

// ---------- Safe week saving ----------
// Only rows that were actually added, changed or removed in this edit are
// written, and each changed/removed row is first checked against what the
// editor originally loaded. If someone else changed it in the meantime, their
// version is kept and the conflict is reported — nobody's edit is silently
// overwritten, and two people can edit different items in the same week.
function normItem(m, anchor){
  const allDay = m.allDay !== false;
  return JSON.stringify({
    date: m.date || anchor || '', status: m.status || 'confirmed', note: (m.note||'').trim(),
    allDay, start: allDay ? '' : (m.startTime||'').slice(0,5), end: allDay ? '' : (m.endTime||'').slice(0,5),
    audience: m.audience || '', owner: ownerColumnsExist ? (m.owner || '') : '',
    tags: (m.tagIds||[]).slice().sort().join(',')
  });
}
function rowToItem(r, tagKey){
  return {id:r.id, note:r.note||'', date:r.item_date, status:r.status||'confirmed', allDay:r.all_day!==false,
    startTime:r.start_time||'', endTime:r.end_time||'', audience:r.audience||'', owner:r.owner||'',
    tagIds:(r[tagKey]||[]).map(t=>t.tag_id)};
}
function snapshotWeek(wk){
  if(!wk) return null;
  const mid = {}, ps = {};
  (wk.midweek||[]).forEach(m=> mid[m.id] = normItem(m, wk.weekCommencing || wk.sundayDate));
  (wk.postService||[]).forEach(m=> ps[m.id] = normItem(m, wk.sundayDate));
  return {
    week: {occasion:wk.occasion||'', sundayDate:wk.sundayDate||'', sundaySeries:wk.sundaySeries||'', weekCommencing:wk.weekCommencing||''},
    midAnchor: wk.weekCommencing || wk.sundayDate, psAnchor: wk.sundayDate,
    midweek: mid, postService: ps
  };
}
async function saveWeekSafely(w, isNew){
  const conflicts = [];
  const orig = isNew ? null : state.editingOriginal;
  const nameOf = m => (m.tagIds||[]).map(tagById).filter(Boolean).map(t=>t.name).join(' + ') || 'An activity';
  const fail = (what, err)=>{ console.error(what, err); conflicts.push(what+': '+(err.message||err)); };

  if(isNew || !orig){
    const { error } = await sb.from('weeks').upsert({id:w.id, occasion:w.occasion||'', sunday_date:w.sundayDate, sunday_series:w.sundaySeries||'', week_commencing:w.weekCommencing||null, happening:w.happening||''});
    if(error){ fail('Could not save this week', error); return conflicts; }
  } else {
    const { data: srv, error } = await sb.from('weeks').select('occasion, sunday_date, sunday_series, week_commencing').eq('id', w.id).maybeSingle();
    if(error){ fail('Could not check this week before saving', error); return conflicts; }
    if(!srv){ conflicts.push('This week was deleted by someone else, so nothing was saved.'); return conflicts; }
    const patch = {};
    [['occasion','occasion','Occasion'],['sundayDate','sunday_date','Sunday date'],['sundaySeries','sunday_series','Sunday series'],['weekCommencing','week_commencing',null]].forEach(([k,col,label])=>{
      const mine = w[k]||'', was = orig.week[k]||'', now = srv[col]||'';
      if(mine===was) return;
      if(now!==was && now!==mine){ if(label) conflicts.push(`${label} was changed by someone else — kept their version ("${now}").`); return; }
      patch[col] = col==='week_commencing' ? (mine||null) : mine;
    });
    if(Object.keys(patch).length){
      const { error: upErr } = await sb.from('weeks').update(patch).eq('id', w.id);
      if(upErr) fail('Could not save the Sunday details', upErr);
    }
  }

  const sections = [
    {key:'midweek', table:'week_midweek_items', tagTable:'week_midweek_item_tags', fk:'midweek_item_id', anchor:w.weekCommencing||w.sundayDate, origAnchor: orig ? orig.midAnchor : null},
    {key:'postService', table:'week_post_service_items', tagTable:'week_post_service_item_tags', fk:'post_service_item_id', anchor:w.sundayDate, origAnchor: orig ? orig.psAnchor : null}
  ];
  const ownerCol = ownerColumnsExist ? ', owner' : '';
  for(const sec of sections){
    const mine = w[sec.key] || [];
    const origMap = orig ? orig[sec.key] : {};
    let srvMap = {};
    if(orig){
      const { data, error } = await sb.from(sec.table).select(`id, note, item_date, status, start_time, end_time, all_day, audience${ownerCol}, ${sec.tagTable} ( tag_id )`).eq('week_id', w.id);
      if(error){ fail('Could not check activities before saving', error); continue; }
      (data||[]).forEach(r=> srvMap[r.id] = normItem(rowToItem(r, sec.tagTable), sec.origAnchor));
    }
    const writeItem = async (m)=>{
      const row = {id:m.id, week_id:w.id, note:m.note||'', item_date:m.date||null, status:m.status||'confirmed',
        all_day:m.allDay!==false, start_time:m.startTime||null, end_time:m.endTime||null, audience:m.audience||null,
        ...(ownerColumnsExist ? {owner:m.owner||null} : {})};
      const { error } = await sb.from(sec.table).upsert(row);
      if(error){ fail(`Could not save "${nameOf(m)}"`, error); return; }
      await sb.from(sec.tagTable).delete().eq(sec.fk, m.id);
      const tagRows = (m.tagIds||[]).map(tid=>({[sec.fk]:m.id, tag_id:tid}));
      if(tagRows.length){
        const { error: tErr } = await sb.from(sec.tagTable).insert(tagRows);
        if(tErr) fail(`Could not save the activity for "${nameOf(m)}"`, tErr);
      }
    };
    const mineIds = new Set();
    for(const m of mine){
      mineIds.add(m.id);
      const was = origMap[m.id];
      if(!was){ await writeItem(m); continue; }                        // newly added
      const mineN = normItem(m, sec.origAnchor);
      if(mineN === was) continue;                                       // untouched
      const now = srvMap[m.id];
      if(!now){ conflicts.push(`"${nameOf(m)}" was removed by someone else — not re-added.`); continue; }
      if(now !== was){ conflicts.push(`"${nameOf(m)}" was changed by someone else — kept their version.`); continue; }
      await writeItem(m);
    }
    for(const id of Object.keys(origMap)){
      if(mineIds.has(id)) continue;
      const now = srvMap[id];
      if(!now) continue;                                                // already gone
      if(now !== origMap[id]){ conflicts.push('An activity you removed had just been changed by someone else — kept it.'); continue; }
      await sb.from(sec.tagTable).delete().eq(sec.fk, id);
      const { error } = await sb.from(sec.table).delete().eq('id', id);
      if(error) fail('Could not remove an activity', error);
    }
  }

  // "Skip this week" exclusions are only ever added, never wiped.
  const { data: exNow } = await sb.from('week_excluded_recurring').select('recurring_rhythm_id').eq('week_id', w.id);
  const have = new Set((exNow||[]).map(r=>r.recurring_rhythm_id));
  const add = (w.excludedRecurring||[]).filter(id=>!have.has(id)).map(id=>({week_id:w.id, recurring_rhythm_id:id}));
  if(add.length){
    const { error } = await sb.from('week_excluded_recurring').insert(add);
    if(error) fail('Could not save a skipped recurring activity', error);
  }
  return conflicts;
}

// Only change the one field that was edited, so a stale copy of a tag can't
// overwrite someone else's change to a different field.
async function updateTagField(id, patch){
  const { error } = await sb.from('tags').update(patch).eq('id', id);
  if(error){ console.error('update tag failed', error); alert('Could not save that change: '+error.message); }
}

// ---------- Stale-tab protection ----------
// A tab left open across a deploy keeps running the old code. Check for a newer
// version when the tab comes back into view (and every few minutes); reload
// straight away if nothing is mid-edit, otherwise show a banner.
const APP_VERSION = '2026-10-02b';
async function checkForNewVersion(){
  try{
    const res = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const html = await res.text();
    const mm = html.match(/<meta name="app-version" content="([^"]+)"/);
    if(!mm || mm[1] === APP_VERSION) return;
    const busy = state.editingWeekId || state.sheet || state.commsSheet || state.showModal || state.showSettings;
    if(!busy){ location.reload(); return; }
    if(!state.updateAvailable){ state.updateAvailable = true; render(); }
  }catch(e){ /* offline etc. — try again later */ }
}

function openWeekEditor(weekId){
  const wk = state.weeks.find(w=>w.id===weekId);
  const mw = wk ? effectiveMidweek(wk) : [];
  const ps = wk ? effectivePostService(wk) : [];
  // Pull in any existing Needs comms? decision so the sheet reflects what's
  // already been chosen (here or in the Comms tab), using the same item_ref_id
  // scheme eventsForRange/comms use.
  const wcAnchor = wk && wk.weekCommencing ? parseISO(wk.weekCommencing) : null;
  const sunAnchor = wk && wk.sundayDate ? parseISO(wk.sundayDate) : null;
  state.editingMidweekRows = mw.map(m=>{
    const d = m.date ? parseISO(m.date) : wcAnchor;
    const key = d ? 'wk-mid-'+wk.id+'-'+m.id+'::'+isoDate(d) : null;
    const plan = key ? state.commsPlans.find(p=>p.itemRefId===key) : null;
    return {...m, needsComms: plan ? plan.needsComms : null};
  });
  state.editingPostServiceRows = ps.map(m=>{
    const d = m.date ? parseISO(m.date) : sunAnchor;
    const key = d ? 'wk-ps-'+wk.id+'-'+m.id+'::'+isoDate(d) : null;
    const plan = key ? state.commsPlans.find(p=>p.itemRefId===key) : null;
    return {...m, needsComms: plan ? plan.needsComms : null};
  });
  state.editingOriginalRecurringIds = new Set(mw.filter(m=>m.recurringId).map(m=>m.recurringId));
  state.editingOriginalPostServiceRecurringIds = new Set(ps.filter(m=>m.recurringId).map(m=>m.recurringId));
  state.editingWeekDraft = null; state.weekMenuOpen = false; state.lastRemoved = null; state.dashMenuOpen = false; state.detailsOpen = false; closeSheet();
  state.editingWeekId = weekId;
  state.editingOriginal = snapshotWeek(wk);
  if(wk && isPastWeek(wk)) state.showPastWeeks = true;
  // make sure the week is inside the dashboard's year/term scope so it's visible
  if(wk && wk.sundayDate){
    const sd = parseISO(wk.sundayDate);
    state.churchYear = churchYearOf(sd);
    if(state.termFilter && termOf(sd)!==state.termFilter) state.termFilter = null;
  }
  render();
  const card = document.querySelector('.week-card.editing');
  if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
}

function attachDashboardHandlers(){
  // ----- Week header fields: kept in a draft so re-renders never lose typing -----
  document.querySelectorAll('.week-card.editing [data-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      if(!state.editingWeekDraft) return;
      state.editingWeekDraft[el.dataset.field] = el.value;
      if(el.dataset.field==='sundayDate'){
        el.style.boxShadow = '';
        const title = document.getElementById('we-title');
        if(title) title.textContent = el.value ? fmtDate(el.value) : 'New week';
        const wcLabel = document.getElementById('we-wc-label');
        if(wcLabel) wcLabel.textContent = el.value ? fmtDate(addDaysISO(el.value,1)) : 'Monday';
      }
    });
  });

  // ----- Compact rows -----
  document.querySelectorAll('.we-row').forEach(el=>{
    const open = ()=>{
      const {entry, section} = findEditingRow(el.dataset.mwid);
      if(!entry) return;
      state.sheet = {rowId:entry.id, section, isNew:false};
      state.sheetDraft = JSON.parse(JSON.stringify(entry));
      state.sheetError = ''; state.lastRemoved = null;
      render();
    };
    el.onclick = open;
    el.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } };
  });
  const detailsToggle = document.getElementById('we-details-toggle');
  if(detailsToggle) detailsToggle.onclick = ()=>{ state.detailsOpen = !state.detailsOpen; render(); };
  const undoBtn = document.getElementById('undo-remove');
  if(undoBtn) undoBtn.onclick = ()=>{
    const lr = state.lastRemoved;
    if(lr && state[lr.arrName]) state[lr.arrName].splice(lr.idx, 0, lr.entry);
    state.lastRemoved = null; clearTimeout(window.__undoTimer);
    render();
  };
  document.querySelectorAll('.we-add').forEach(el=>{
    el.onclick = ()=>{
      const blank = {id:uid(), tagIds:[], note:'', status:'confirmed', allDay:true, audience:'', owner:'', date:'', needsComms:null};
      state.sheet = {rowId:blank.id, section:el.dataset.section, isNew:true};
      state.sheetDraft = blank;
      state.sheetError = ''; state.lastRemoved = null;
      render();
    };
  });
  const menuBtn = document.getElementById('we-menu-btn');
  if(menuBtn) menuBtn.onclick = (e)=>{ e.stopPropagation(); state.weekMenuOpen = !state.weekMenuOpen; render(); };

  // ----- Bottom sheet -----
  const overlay = document.getElementById('sheet-overlay');
  if(overlay && state.sheetDraft){
    const d = state.sheetDraft;
    overlay.onclick = (e)=>{ if(e.target===overlay){ closeSheet(); render(); } };
    const byId = id => document.getElementById(id);
    if(byId('sh-cancel')) byId('sh-cancel').onclick = ()=>{ closeSheet(); render(); };
    if(byId('sh-remove')) byId('sh-remove').onclick = ()=>{ const id = state.sheet.rowId; closeSheet(); removeEditorRow(id); render(); };
    if(byId('sh-item')) byId('sh-item').onchange = ()=>{
      syncSheetFromDOM();
      const val = byId('sh-item').value;
      if(val==='__new__'){ d.creatingTag = true; d.tagIds = []; }
      else d.tagIds = val ? [val] : [];
      state.sheetError = '';
      render();
      if(d.creatingTag && byId('sh-newtag-name')) byId('sh-newtag-name').focus();
    };
    if(byId('sh-back-to-list')) byId('sh-back-to-list').onclick = ()=>{ syncSheetFromDOM(); d.creatingTag = false; d.newTagName = ''; render(); };
    document.querySelectorAll('.sh-day').forEach(el=>{
      el.onclick = ()=>{
        syncSheetFromDOM();
        d.otherDate = false;
        d.date = el.dataset.date === editorDefaultDate(state.sheet.section) ? '' : el.dataset.date;
        render();
      };
    });
    if(byId('sh-other-day')) byId('sh-other-day').onclick = ()=>{
      syncSheetFromDOM();
      d.otherDate = true;
      if(!d.date) d.date = editorDefaultDate(state.sheet.section);
      render();
      const inp = byId('sh-date');
      if(inp){ inp.focus(); try{ inp.showPicker && inp.showPicker(); }catch(e){} }
    };
    document.querySelectorAll('.sh-status').forEach(el=>{
      el.onclick = ()=>{ syncSheetFromDOM(); d.status = el.dataset.status; render(); };
    });
    document.querySelectorAll('.sh-comms').forEach(el=>{
      el.onclick = ()=>{
        syncSheetFromDOM();
        const val = el.dataset.choice==='yes';
        d.needsComms = d.needsComms===val ? null : val;
        render();
      };
    });
    if(byId('sh-more')) byId('sh-more').onclick = (e)=>{ e.preventDefault(); syncSheetFromDOM(); state.sheetMore = !state.sheetMore; render(); };
    if(byId('sh-delete-tag')) byId('sh-delete-tag').onclick = async ()=>{
      const id = byId('sh-delete-tag').dataset.tagid;
      const t = tagById(id);
      if(!confirm(`Delete "${t?t.name:'this activity'}"? This removes it from every week and recurring rhythm that uses it.`)) return;
      syncSheetFromDOM();
      await deleteTagRemote(id);
      state.tags = state.tags.filter(x=>x.id!==id);
      (state.editingMidweekRows||[]).forEach(r=>{ if(r.tagIds) r.tagIds = r.tagIds.filter(x=>x!==id); });
      (state.editingPostServiceRows||[]).forEach(r=>{ if(r.tagIds) r.tagIds = r.tagIds.filter(x=>x!==id); });
      d.tagIds = (d.tagIds||[]).filter(x=>x!==id);
      render();
    };
    if(byId('sh-done')) byId('sh-done').onclick = async ()=>{
      syncSheetFromDOM();
      if(d.creatingTag){
        const name = (d.newTagName||'').trim();
        if(!name){ state.sheetError = 'Give the new activity a name first.'; render(); return; }
        const existing = state.tags.find(t=>t.name.toLowerCase()===name.toLowerCase());
        if(existing){ d.tagIds = [existing.id]; }
        else {
          const audience = d.audience || ((state.audiences[0] && state.audiences[0].name) || 'Whole Church');
          const newTag = {id:uid(), name, audience, defaultOwner:''};
          state.tags.push(newTag);
          await saveTags(newTag);
          d.tagIds = [newTag.id];
        }
        d.creatingTag = false; d.newTagName = '';
      }
      if(!(d.tagIds||[]).length){ state.sheetError = 'Choose an activity first.'; render(); return; }
      d.allDay = !d.startTime;
      if(d.allDay){ d.startTime = ''; d.endTime = ''; }
      delete d.otherDate;
      const arrName = state.sheet.section==='midweek' ? 'editingMidweekRows' : 'editingPostServiceRows';
      if(state.sheet.isNew) state[arrName].push(d);
      else {
        const idx = state[arrName].findIndex(r=>r.id===state.sheet.rowId);
        if(idx>-1) state[arrName][idx] = d;
      }
      closeSheet();
      render();
    };
  }

  document.querySelectorAll('.edit-week').forEach(el=>{
    el.onclick = ()=> openWeekEditor(el.dataset.id);
    el.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openWeekEditor(el.dataset.id); } };
  });
  const dashMenuBtn = document.getElementById('dash-menu-btn');
  if(dashMenuBtn) dashMenuBtn.onclick = ()=>{ state.dashMenuOpen = !state.dashMenuOpen; render(); };
  const jumpNow = document.getElementById('jump-now');
  if(jumpNow) jumpNow.onclick = ()=>{
    const c = document.getElementById('wk-'+jumpNow.dataset.id);
    if(c){ c.scrollIntoView({behavior:'smooth', block:'center'}); c.focus({preventScroll:true}); }
  };
  const togglePast = document.getElementById('toggle-past');
  if(togglePast) togglePast.onclick = ()=>{ state.showPastWeeks = !state.showPastWeeks; render(); };
  document.querySelectorAll('.cancel-week').forEach(el=>{
    el.onclick = ()=>{ clearWeekEditing(); render(); };
  });
  document.querySelectorAll('.delete-week').forEach(el=>{
    el.onclick = async ()=>{
      if(el.dataset.id!=='new'){
        if(!confirm('Delete this whole week, including everything planned in it? This can\'t be undone.')) return;
        await deleteWeekRemote(el.dataset.id);
        state.weeks = state.weeks.filter(w=>w.id!==el.dataset.id);
      }
      clearWeekEditing();
      render();
    };
  });
  document.querySelectorAll('.save-week').forEach(el=>{
    el.onclick = async ()=>{
      const card = el.closest('.week-card');
      const draft = state.editingWeekDraft || {};
      const existingWeek = state.weeks.find(w=>w.id===el.dataset.id);
      const sundayDate = (draft.sundayDate||'').trim();
      // Week commencing is always the Monday after the Sunday — derived, not typed.
      const data = {
        occasion: (draft.occasion||'').trim(), sundayDate, sundaySeries: (draft.sundaySeries||'').trim(),
        weekCommencing: sundayDate ? addDaysISO(sundayDate, 1) : '',
        happening: existingWeek ? (existingWeek.happening||'') : ''
      };
      if(!data.sundayDate){
        state.detailsOpen = true; render();
        const inp = document.querySelector('.week-card.editing [data-field="sundayDate"]');
        if(inp){ inp.style.boxShadow = '0 0 0 2px var(--bad)'; inp.scrollIntoView({behavior:'smooth', block:'center'}); }
        return;
      }
      el.disabled = true; el.textContent = 'Saving…';

      // Processes one section's rows (midweek or post-service) straight from the
      // editing arrays — the sheet writes every field into the entry on "Done", so
      // there's no DOM to read and nothing can be lost by rows being collapsed.
      // commsDecisions is returned separately since needsComms lives in comms_plans.
      function processSection(sectionName, anchorDate){
        const items = [];
        const commsDecisions = [];
        const stillPresentRecurring = new Set();
        const newRecurringTemplates = [];
        const newTags = [];
        const rows = sectionName==='midweek' ? (state.editingMidweekRows||[]) : (state.editingPostServiceRows||[]);
        rows.forEach(entry=>{
          if(entry.recurringId){ stillPresentRecurring.add(entry.recurringId); return; }
          const mwid = entry.id;
          const tagIds = (entry.tagIds||[]).slice();
          if(!tagIds.length) return;
          const note = (entry.note||'').trim();
          const status = entry.status || 'confirmed';
          const date = entry.date || '';
          const audience = entry.audience || '';
          const allDay = entry.allDay !== false;
          const startTime = !allDay ? (entry.startTime||'') : '';
          const endTime = !allDay ? (entry.endTime||'') : '';
          const freqVal = entry.repeatFreq || '';
          if(freqVal){
            const [freq, intervalStr] = freqVal.split(':');
            newRecurringTemplates.push({
              id:uid(), tagIds, note, startDate: anchorDate,
              endDate:null, freq, interval: parseInt(intervalStr,10)||1, endType:'never', occurrenceCount:null,
              dayOffset:0, slot: sectionName
            });
          } else {
            items.push({id:mwid, tagIds, note, date: date || null, status, allDay, startTime, endTime, audience, owner: entry.owner || ''});
            if(entry.needsComms===true || entry.needsComms===false){
              const itemTitle = tagIds.map(tid=>tagById(tid)).filter(Boolean).map(t=>t.name).join(' + ') || 'Untitled activity';
              commsDecisions.push({mwid, date: date || null, needsComms: entry.needsComms, itemTitle});
            }
          }
        });
        return {items, commsDecisions, stillPresentRecurring, newRecurringTemplates, newTags};
      }

      const mwResult = processSection('midweek', data.weekCommencing || data.sundayDate);
      const psResult = processSection('postService', data.sundayDate);

      const allNewTags = [...mwResult.newTags, ...psResult.newTags];
      if(allNewTags.length) await saveTags(allNewTags);

      // work out which recurring items (either section) were removed for this week only
      const originally = new Set([
        ...(state.editingOriginalRecurringIds || []),
        ...(state.editingOriginalPostServiceRecurringIds || [])
      ]);
      const stillPresent = new Set([...mwResult.stillPresentRecurring, ...psResult.stillPresentRecurring]);
      const removedThisWeek = [...originally].filter(id=>!stillPresent.has(id));

      const allNewRecurringTemplates = [...mwResult.newRecurringTemplates, ...psResult.newRecurringTemplates];
      if(allNewRecurringTemplates.length){
        state.recurringRhythms.push(...allNewRecurringTemplates);
        await saveRecurring(allNewRecurringTemplates);
      }

      let savedWeek;
      if(el.dataset.id==='new'){
        savedWeek = {id: uid(), ...data, midweek: mwResult.items, postService: psResult.items, excludedRecurring: removedThisWeek};
        state.weeks.push(savedWeek);
      } else {
        const idx = state.weeks.findIndex(w=>w.id===el.dataset.id);
        if(idx>-1){
          const prevExcluded = state.weeks[idx].excludedRecurring || [];
          const mergedExcluded = Array.from(new Set([...prevExcluded, ...removedThisWeek]));
          state.weeks[idx] = {...state.weeks[idx], ...data, midweek: mwResult.items, postService: psResult.items, excludedRecurring: mergedExcluded};
          savedWeek = state.weeks[idx];
        }
      }
      let conflicts = [];
      if(savedWeek) conflicts = await saveWeekSafely(savedWeek, el.dataset.id==='new');

      // Write any inline Needs comms? decisions to comms_plans now that the week
      // and its items have real, final ids — upserting on item_ref_id means this
      // converges with anything already set from the Comms tab rather than fighting it.
      if(savedWeek){
        const anchorMw = savedWeek.weekCommencing ? parseISO(savedWeek.weekCommencing) : null;
        const anchorPs = savedWeek.sundayDate ? parseISO(savedWeek.sundayDate) : null;
        const decisions = [
          ...mwResult.commsDecisions.map(d=>({...d, prefix:'wk-mid-', itemType:'midweek', anchor:anchorMw})),
          ...psResult.commsDecisions.map(d=>({...d, prefix:'wk-ps-', itemType:'postService', anchor:anchorPs}))
        ];
        const newPlans = [];
        decisions.forEach(d=>{
          const dt = d.date ? parseISO(d.date) : d.anchor;
          if(!dt) return;
          const key = d.prefix + savedWeek.id + '-' + d.mwid + '::' + isoDate(dt);
          let plan = state.commsPlans.find(p=>p.itemRefId===key);
          if(plan){ plan.needsComms = d.needsComms; if(d.itemTitle) plan.itemTitle = d.itemTitle; }
          else {
            plan = {id:uid(), itemType:d.itemType, itemRefId:key, needsComms:d.needsComms, autoFlowId:null, itemTitle:d.itemTitle||'', notes:''};
            state.commsPlans.push(plan);
          }
          newPlans.push(plan);
        });
        if(newPlans.length) await saveCommsPlan(newPlans);
      }

      clearWeekEditing();
      await loadData();
      render();
      if(conflicts.length) alert('Saved — with a few notes:\n\n• ' + conflicts.join('\n• '));
    };
  });
  const addWeekBtn = document.getElementById('add-week');
  if(addWeekBtn) addWeekBtn.onclick = ()=>{
    clearWeekEditing();
    state.editingWeekId = 'new';
    state.detailsOpen = true;
    state.editingMidweekRows = [];
    state.editingPostServiceRows = [];
    state.editingOriginalRecurringIds = new Set();
    state.editingOriginalPostServiceRecurringIds = new Set();
    render();
    const el = document.querySelector('.week-card.editing');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  };
  const fillBtn = document.getElementById('fill-weeks');
  if(fillBtn) fillBtn.onclick = async ()=>{
    state.dashMenuOpen = false;
    if(!state.termFilter){
      alert('Pick a term tab first (Autumn/Spring/Summer) so we know which Sundays to fill for '+churchYearLabel(state.churchYear)+'.');
      return;
    }
    const term = state.termFilter;
    const [start, end] = termDateRangeForYear(term, state.churchYear);
    const sundays = allSundaysInRange(start, end);
    const existing = new Set(state.weeks.map(w=>w.sundayDate));
    const added = [];
    sundays.forEach(s=>{
      const iso = isoDate(s);
      if(!existing.has(iso)){
        const wc = new Date(s.getFullYear(), s.getMonth(), s.getDate()+1);
        const w = {id:uid(), occasion:'', sundayDate:iso, sundaySeries:'', weekCommencing:isoDate(wc), happening:'', midweek:[], postService:[], excludedRecurring:[]};
        state.weeks.push(w);
        added.push(w);
      }
    });
    if(added.length){ await saveWeeks(added); render(); }
    else alert('All Sundays for this term are already on the sheet.');
  };
}

(async ()=>{
  await loadData();
  render();
  subscribeRealtime();
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForNewVersion(); });
  setInterval(checkForNewVersion, 5*60*1000);
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && state.sheet){ closeSheet(); render(); }
    else if(e.key==='Escape' && state.commsSheet){ state.commsSheet = null; render(); }
  });
})();
</script>
</body>
</html>
