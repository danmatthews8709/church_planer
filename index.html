<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-version" content="2026-10-02b">
<title>The Church Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap');

  :root{
    --ink:#201A3D;
    --ink-soft:#6B6580;
    --paper:#F1F0F6;
    --paper-raised:#FFFFFF;
    --line:#E2E0EA;
    --navy:#241B57;
    --navy-deep:#160F3D;
    --gold:#C99A3B;
    --gold-soft:#F6ECD3;
    --good:#1E7145;
    --good-soft:#E3F1E8;
    --warn:#C99A3B;
    --warn-soft:#F6ECD3;
    --bad:#B0392F;
    --bad-soft:#F7DFDB;
    --spring:#7A9B76;
    --spring-soft:#E4EBE1;
    --summer:#C9932E;
    --summer-soft:#F3E7CC;
    --autumn:#B85C38;
    --autumn-soft:#F1DDCF;
    --winter:#4A6C8C;
    --winter-soft:#DEE6ED;
    --tl-green:#1E9E5C;
    --tl-green-soft:#E0F4E8;
    --tl-amber:#E0A020;
    --tl-amber-soft:#FBF0D6;
    --tl-red:#D9453D;
    --tl-red-soft:#FBE2E0;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Calibri','Carlito',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--summer-soft);}

  .app{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}

  /* ---------- Header ---------- */
  .masthead{
    display:flex;justify-content:space-between;align-items:center;
    margin:-28px -20px 0;padding:18px 24px;
    background:var(--navy);color:#fff;
    border-bottom:4px solid var(--gold);
    flex-wrap:wrap;gap:12px;
  }
  .masthead h1{
    font-family:'Calibri','Carlito',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.01em;
    margin:0;color:#fff;
  }
  .masthead .sub{
    font-family:'Calibri','Carlito',sans-serif;font-size:11px;color:rgba(255,255,255,.6);
    text-transform:uppercase;letter-spacing:0.08em;
  }
  .who{
    display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.85);
  }
  .who button{
    font-family:'Calibri','Carlito',sans-serif;font-size:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);
    border-radius:6px;padding:5px 10px;cursor:pointer;color:#fff;
  }
  .who button:hover{background:rgba(255,255,255,.2);}

  /* ---------- Term ribbon (signature element) ---------- */
  .ribbon{
    display:flex;gap:6px;margin:18px 0 22px;
  }
  .tab{
    flex:1;position:relative;
    padding:10px 14px 12px;
    border:1px solid var(--line);border-bottom:none;
    border-radius:8px 8px 0 0;
    background:var(--paper-raised);
    cursor:pointer;
    font-family:'Calibri','Carlito',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.09em;
    color:var(--ink-soft);
    transition:transform .15s ease;
  }
  .tab .label{display:block;font-family:'Calibri','Carlito',sans-serif;font-size:17px;text-transform:none;letter-spacing:0;color:var(--ink);margin-top:4px;}
  .tab .months{opacity:.7;}
  .tab.active{transform:translateY(-4px);box-shadow:0 -3px 0 0 var(--tab-color) inset, 0 2px 6px rgba(0,0,0,0.08);}
  .tab.current::after{
    content:'today';position:absolute;top:-9px;right:10px;
    background:var(--tab-color);color:#fff;font-size:9px;padding:2px 7px;border-radius:20px;
    font-family:'Calibri','Carlito',sans-serif;letter-spacing:0.03em;
  }
  .tab[data-term="spring"]{--tab-color:var(--spring);}
  .tab[data-term="summer"]{--tab-color:var(--summer);}
  .tab[data-term="autumn"]{--tab-color:var(--autumn);}
  .tab.active[data-term="spring"]{background:var(--spring-soft);}
  .tab.active[data-term="summer"]{background:var(--summer-soft);}
  .tab.active[data-term="autumn"]{background:var(--autumn-soft);}
  .ribbon-bar{height:3px;background:var(--navy);margin-top:-1px;margin-bottom:20px;}

  /* ---------- Church year switcher ---------- */
  .year-switcher{
    display:flex;align-items:center;justify-content:center;gap:16px;
    margin:18px 0 2px;
  }
  .year-switcher button{
    background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;
    cursor:pointer;font-size:15px;color:var(--ink);
  }
  .year-switcher button:hover{background:var(--paper-raised);}
  .year-label{
    font-family:'Calibri','Carlito',sans-serif;font-size:19px;font-weight:700;min-width:130px;text-align:center;
    display:flex;align-items:center;gap:8px;justify-content:center;
  }
  .year-current{
    font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
    background:var(--gold);color:#fff;padding:2px 8px;border-radius:20px;font-weight:700;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    margin-bottom:18px;
  }
  .view-toggle{display:flex;border:1px solid var(--navy);border-radius:8px;overflow:hidden;}
  .view-toggle button{
    font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:13px;
    background:var(--paper-raised);border:none;padding:8px 16px;cursor:pointer;color:var(--ink-soft);
  }
  .view-toggle button.active{background:var(--navy);color:#fff;}
  .nav-group{display:flex;align-items:center;gap:10px;}
  .nav-group button{
    background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;
    cursor:pointer;font-size:15px;color:var(--ink);
  }
  .nav-group button:hover{background:var(--paper-raised);}
  .month-label{font-family:'Calibri','Carlito',sans-serif;font-size:20px;min-width:170px;text-align:center;}
  .add-btn{
    font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:13px;
    background:var(--navy);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;cursor:pointer;
  }
  .add-btn:hover{opacity:.88;}

  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .chip{
    font-family:'Calibri','Carlito',sans-serif;font-size:11px;letter-spacing:0.03em;
    padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--paper-raised);
    cursor:pointer;color:var(--ink-soft);
  }
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 0 0 2px var(--gold-soft);}
  .clear-filters{
    font-family:'Calibri','Carlito',sans-serif;font-size:11px;letter-spacing:0.02em;
    padding:5px 11px;border-radius:20px;border:1px dashed var(--bad);background:var(--bad-soft);
    cursor:pointer;color:var(--bad);font-weight:700;
  }
  .clear-filters:hover{background:var(--bad);color:#fff;}

  /* ---------- Calendar ---------- */
  .ev-pill{
    font-size:10.5px;padding:2px 6px;border-radius:5px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;
    min-width:0;max-width:100%;
  }
  .ev-pill.small-group{background:var(--spring);}
  .ev-pill.prayer{background:var(--winter);}
  .ev-pill.service{background:var(--navy);font-weight:700;}
  .ev-pill.event{background:var(--autumn);}
  .ev-pill.tag{color:#fff;}
  .ev-pill.tag.dominant{font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;}
  .busy-flag{
    display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:9.5px;font-weight:700;
    padding:1px 6px;border-radius:20px;margin-left:5px;text-transform:uppercase;letter-spacing:.03em;vertical-align:middle;
  }

  /* ---------- Mobile calendar agenda ---------- */
  .cal-agenda{display:flex;flex-direction:column;gap:10px;}
  .agenda-day{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;display:flex;gap:14px;
  }
  .agenda-day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .agenda-day.sunday{border-left:4px solid var(--navy);}
  .agenda-day.empty-day{opacity:.5;}
  .agenda-date{flex-shrink:0;width:46px;text-align:center;}
  .agenda-date .dow{font-family:'Calibri','Carlito',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .agenda-date .num{font-family:'Calibri','Carlito',sans-serif;font-size:22px;line-height:1.1;}
  .agenda-day.today .num{color:var(--gold);}
  .agenda-events{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
  .agenda-events .ev-pill{white-space:normal;font-size:12px;padding:5px 9px;}
  .agenda-none{font-size:12px;color:var(--ink-soft);font-style:italic;padding-top:4px;}
  @media (min-width:641px){
    .agenda-day{padding:14px 18px;}
    .agenda-date{width:60px;}
    .agenda-date .num{font-size:26px;}
    .agenda-events .ev-pill{font-size:13px;padding:6px 11px;}
  }
  .agenda-month-divider{
    font-family:'Calibri','Carlito',sans-serif;font-size:13px;font-weight:700;color:var(--ink-soft);
    margin:8px 2px 0;text-transform:uppercase;letter-spacing:.05em;
  }

  /* ---------- List view ---------- */
  .list-month{margin-bottom:26px;}
  .list-month h3{
    font-family:'Calibri','Carlito',sans-serif;font-size:19px;margin:0 0 10px;
    border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  .list-row{
    display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;
    cursor:pointer;flex-wrap:wrap;
  }
  .list-row.indented{margin-left:34px;padding-left:14px;border-left:2px solid var(--line);}
  .list-row:hover{background:var(--paper-raised);}
  .list-date{
    font-family:'Calibri','Carlito',sans-serif;font-size:12px;color:var(--ink-soft);min-width:76px;
  }
  .list-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .list-dot.small-group{background:var(--spring);}
  .list-dot.prayer{background:var(--winter);}
  .list-dot.service{background:var(--navy);}
  .list-dot.event{background:var(--autumn);}
  .list-title{font-weight:600;font-size:14px;flex:1;min-width:120px;}
  .list-meta{font-size:11.5px;color:var(--ink-soft);}
  .empty{
    text-align:center;padding:50px 20px;color:var(--ink-soft);font-family:'Calibri','Carlito',sans-serif;font-size:17px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(43,42,40,0.45);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:var(--paper-raised);border-radius:12px;padding:26px;max-width:420px;width:100%;
    box-shadow:0 12px 32px rgba(0,0,0,0.2);
    max-height:90vh;overflow-y:auto;
  }
  .modal h2{font-family:'Calibri','Carlito',sans-serif;font-size:22px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    font-family:'Calibri','Carlito',sans-serif;font-size:14px;background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .cat-picker{display:flex;gap:6px;flex-wrap:wrap;}
  .cat-opt{
    padding:7px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;
    background:#fff;
  }
  .cat-opt.on{color:#fff;border-color:transparent;}
  .cat-opt[data-cat="small-group"].on{background:var(--spring);}
  .cat-opt[data-cat="prayer"].on{background:var(--winter);}
  .cat-opt[data-cat="service"].on{background:var(--summer);color:var(--ink);}
  .cat-opt[data-cat="event"].on{background:var(--autumn);}
  .modal-actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
  .btn{padding:9px 16px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:13px;}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.danger{color:var(--autumn);border-color:var(--autumn);}
  .pin-dots{display:flex;gap:8px;justify-content:center;margin:14px 0;}
  .pin-dots span{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);}
  .pin-dots span.filled{background:var(--navy);}
  .user-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .user-chip{
    padding:8px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;background:#fff;
  }
  .user-chip:hover{background:var(--paper-raised);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .keypad button{
    padding:14px 0;font-size:17px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;
  }
  .keypad button:hover{background:var(--paper-raised);}
  .error-text{color:var(--autumn);font-size:12px;margin-top:6px;}
  .notice{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.4;}

  /* ---------- Dashboard (rhythm timeline) ---------- */
  .app.wide{max-width:1240px;}
  .weeks-timeline{display:flex;flex-direction:column;gap:12px;}
  .week-card{
    background:var(--paper-raised);border:1px solid var(--line);border-left:5px solid var(--term-color,var(--ink));
    border-radius:10px;padding:16px 18px;display:flex;gap:22px;flex-wrap:wrap;
  }
  .week-card.editing{border-left-style:dashed;background:#fff;}
  .wc-left{min-width:96px;flex-shrink:0;}
  .wc-week{font-family:'Calibri','Carlito',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-soft);}
  .wc-date{font-family:'Calibri','Carlito',sans-serif;font-size:21px;line-height:1.15;margin-top:3px;}
  .wc-occasion{margin-top:9px;display:inline-block;background:var(--summer-soft);color:var(--ink);font-size:10.5px;
    padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:0.02em;}
  .wc-main{flex:1;min-width:240px;}
  .wc-series{font-family:'Calibri','Carlito',sans-serif;font-size:18px;margin:0 0 6px;}
  .wc-series.empty{color:var(--ink-soft);font-style:italic;font-size:15px;}
  .wc-post{font-size:12.5px;color:var(--ink-soft);white-space:pre-line;margin-bottom:9px;line-height:1.5;}
  .wc-mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .wc-rhythm-pill{font-size:11px;font-weight:600;padding:3px 11px;border-radius:20px;color:#fff;}
  .wc-rhythm-pill.dominant{font-weight:800;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;}
  .mw-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .mw-row{position:relative;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 34px 12px 10px;background:#fff;}
  .mw-tags-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .mw-tags-line select{flex:1.1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;color:var(--ink);}
  .mw-tags-line input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;color:var(--ink);}
  .mw-tags-line button{border:none;background:none;color:var(--bad);cursor:pointer;font-size:14px;padding:2px 4px;}
  .mw-row-remove{position:absolute;top:8px;right:8px;border:none;background:none;color:var(--bad);cursor:pointer;font-size:14px;padding:4px 6px;line-height:1;border-radius:5px;}
  .mw-row-remove:hover{background:var(--paper);}
  .mw-field{display:flex;flex-direction:column;gap:4px;}
  .mw-field label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
  .mw-field input,.mw-field select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;color:var(--ink);font-family:'Calibri','Carlito',sans-serif;}
  .mw-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mw-field-grid .full{grid-column:1/3;}
  .mw-repeat-link{border:none;background:none;color:var(--ink-soft);text-decoration:underline;font-size:11.5px;cursor:pointer;padding:0;font-family:'Calibri','Carlito',sans-serif;}
  .mw-repeat-link:hover{color:var(--ink);}
  .mw-row-fields{display:flex;flex-direction:column;gap:12px;width:100%;}
  .mw-row-fold{position:absolute;top:8px;right:34px;border:none;background:none;color:var(--ink-soft);text-decoration:underline;font-size:11px;cursor:pointer;font-family:'Calibri','Carlito',sans-serif;font-weight:600;}
  .mw-row-fold:hover{color:var(--ink);}
  .mw-row-folded{display:flex;align-items:center;gap:8px;padding:10px 34px 10px 10px;position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .mw-row-summary{flex:1;min-width:0;padding:6px 12px;border-radius:6px;color:#fff;overflow:hidden;}
  .mw-row-summary-name{font-size:13px;font-weight:700;display:block;}
  .mw-row-summary-meta{font-size:11px;opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mw-row-edit{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Calibri','Carlito',sans-serif;flex-shrink:0;}
  .mw-row-edit:hover{background:var(--paper);color:var(--ink);}
  .mw-row-fields .mw-field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .mw-row-fields select,.mw-row-fields input[type="text"],.mw-row-fields input[type="date"],.mw-row-fields input[type="time"]{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;
    background:#fff;color:var(--ink);font-family:'Calibri','Carlito',sans-serif;
  }
  .mw-item-row{display:flex;gap:8px;align-items:center;}
  .mw-item-row select{flex:1;}
  .mw-item-delete{border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:8px 11px;border-radius:6px;flex-shrink:0;}
  .mw-item-delete:hover{color:#fff;background:var(--bad);border-color:var(--bad);}
  .mw-recurring-item{display:inline-block;color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;}
  .mw-radio-group{display:flex;gap:18px;}
  .mw-radio-option{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);cursor:pointer;font-weight:600;}
  .mw-allday-label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);font-weight:600;}
  .mw-time-row{display:flex;gap:8px;margin-top:8px;}
  .mw-time-row .mw-field{flex:1;}
  .mw-add{border:1px dashed var(--line);background:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-family:'Calibri','Carlito',sans-serif;font-weight:600;}
  .mw-add:hover{background:var(--paper);color:var(--ink);}
  .mw-cancel-newtag{border:1px solid var(--line)!important;background:#fff!important;color:var(--ink-soft)!important;border-radius:6px;font-size:11px!important;padding:5px 8px!important;white-space:nowrap;font-family:'Calibri','Carlito',sans-serif;flex:0 0 auto!important;}
  .mw-cancel-newtag:hover{background:var(--paper)!important;color:var(--ink)!important;}
  .rr-tag-toggle{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:20px;font-size:11.5px;padding:4px 11px;cursor:pointer;white-space:nowrap;
    font-family:'Calibri','Carlito',sans-serif;font-weight:600;
  }
  .rr-tag-toggle:hover{background:var(--paper);}
  .rr-card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .rr-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;}
  .rr-line select,.rr-line input{padding:6px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff;color:var(--ink);}
  .rr-line input[type="number"]{width:52px;text-align:center;}
  .rr-line .rr-label{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .rr-line .rr-name{flex:1;font-size:12.5px;font-weight:600;min-width:100px;}
  .settings-btn{background:rgba(255,255,255,.08)!important;}
  .settings-section{margin-bottom:18px;}
  .settings-section h4{font-family:'Calibri','Carlito',sans-serif;font-size:15px;margin:0 0 10px;}
  .tag-row{display:flex;gap:6px;align-items:center;margin-bottom:7px;}
  .tag-row input[type="text"]{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
  .tag-row select{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
  .tag-row button{border:none;background:none;color:var(--bad);cursor:pointer;font-size:14px;}
  .aud-swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .wc-commencing{font-family:'Calibri','Carlito',sans-serif;font-size:11px;color:var(--ink-soft);}
  .wc-happening{font-size:12.5px;white-space:pre-line;line-height:1.5;}
  .wc-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .wc-actions button{
    border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;
    font-family:'Calibri','Carlito',sans-serif;font-weight:600;color:var(--ink-soft);
  }
  .wc-actions button:hover{background:var(--paper);color:var(--ink);}
  .wc-actions button.danger{color:var(--autumn);border-color:var(--autumn);}
  .wc-edit-grid{flex:1;min-width:260px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px;}
  .wc-edit-grid .full{grid-column:1/3;}
  .wc-edit-grid label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .wc-edit-grid input,.wc-edit-grid textarea{
    width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-family:'Calibri','Carlito',sans-serif;font-size:13px;background:#fff;color:var(--ink);
  }
  .wc-edit-grid textarea{resize:vertical;min-height:44px;}
  .dash-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .dash-toolbar .term-label{font-family:'Calibri','Carlito',sans-serif;font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;}

  /* ---------- Status (confirmed / needs approval / cancelled) ---------- */
  .mw-status-picker{display:flex;gap:6px;align-items:center;flex:0 0 auto;}
  .mw-status-label{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .status-dot-btn{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex:0 0 auto;transition:transform .1s ease;}
  .status-dot-btn.confirmed{background:var(--tl-green);}
  .status-dot-btn.pending{background:var(--tl-amber);}
  .status-dot-btn.declined{background:var(--tl-red);}
  .status-dot-btn.selected{border-color:var(--ink);box-shadow:0 0 0 1.5px #fff inset;transform:scale(1.15);}
  .mw-status-current{font-size:11.5px;font-weight:700;margin-left:2px;white-space:nowrap;}
  .mw-status-current.confirmed{color:var(--tl-green);}
  .mw-status-current.pending{color:var(--tl-amber);}
  .mw-status-current.declined{color:var(--tl-red);}
  .status-badge{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;display:inline-block;}
  .status-badge.confirmed{background:var(--tl-green-soft);color:var(--tl-green);}
  .status-badge.pending{background:var(--tl-amber-soft);color:var(--tl-amber);}
  .status-badge.declined{background:var(--tl-red-soft);color:var(--tl-red);}
  .wc-rhythm-pill.status-confirmed{box-shadow:0 0 0 2px var(--tl-green) inset;}
  .wc-rhythm-pill.status-pending{box-shadow:0 0 0 2px var(--tl-amber) inset;}
  .wc-rhythm-pill.status-declined{box-shadow:0 0 0 2px var(--tl-red) inset;opacity:.6;text-decoration:line-through;}
  .ev-pill.status-confirmed{box-shadow:0 0 0 2px var(--tl-green) inset;}
  .ev-pill.status-pending{box-shadow:0 0 0 2px var(--tl-amber) inset;}
  .ev-pill.status-declined{box-shadow:0 0 0 2px var(--tl-red) inset;opacity:.6;}
  .list-dot.status-confirmed{background:var(--tl-green)!important;}
  .list-dot.status-pending{background:var(--tl-amber)!important;}
  .list-dot.status-declined{background:var(--tl-red)!important;opacity:.6;}
  .list-month-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 10px;}
  .list-month-head h3{border:none;padding:0;margin:0;}
  .export-pdf-month{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--ink-soft);font-family:'Calibri','Carlito',sans-serif;font-weight:600;}
  .export-pdf-month:hover{background:var(--paper);color:var(--ink);}

  /* ---------- Comms Plan ---------- */
  .comms-subtabs{display:flex;gap:6px;margin-bottom:16px;}
  .comms-subtab{
    font-family:'Calibri','Carlito',sans-serif;font-weight:600;font-size:13px;
    background:var(--paper-raised);border:1px solid var(--line);padding:8px 16px;cursor:pointer;color:var(--ink-soft);
    border-radius:8px;
  }
  .comms-subtab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .comms-item{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
  }
  .comms-item.expanded{border-color:var(--gold);}
  .comms-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .comms-item-meta{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .comms-item-title{font-size:15px;font-weight:600;margin-top:2px;}
  .comms-yesno{display:flex;gap:6px;flex-shrink:0;}
  .comms-yesno button{
    border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:12px;
    font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Calibri','Carlito',sans-serif;
  }
  .comms-yes-btn{border-color:var(--navy)!important;background:var(--navy)!important;color:#fff!important;}
  .comms-badge{
    font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--gold-soft);color:var(--gold);
    text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
  }
  .comms-row{
    display:flex;align-items:center;gap:12px;background:var(--paper-raised);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;margin-bottom:8px;flex-wrap:wrap;
  }
  .comms-row-date{font-family:'Calibri','Carlito',sans-serif;font-size:12px;color:var(--ink-soft);min-width:66px;flex-shrink:0;}
  .comms-row-main{flex:1;min-width:140px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .comms-row-title{font-size:13.5px;font-weight:600;}
  .comms-row-meta{font-size:11px;color:var(--ink-soft);}
  .comms-row-chan-badge{font-size:10.5px;font-weight:700;color:#fff;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .comms-status-badge-sm{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .comms-post-expand,.comms-post-fold{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:6px;padding:5px 12px;
    font-size:12px;font-weight:600;cursor:pointer;font-family:'Calibri','Carlito',sans-serif;flex-shrink:0;
  }
  .comms-post-expand:hover,.comms-post-fold:hover{background:var(--paper);color:var(--ink);}
  .comms-cal-pill{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:11px;padding:5px 9px;border-radius:6px;color:#fff;
  }
  .comms-cal-pill-main{display:block;}
  .comms-cal-pill-for{display:block;font-size:9.5px;opacity:.85;margin-top:1px;}
  .comms-cal-pill-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .comms-cal-pill-status{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .comms-cal-post-expand{
    border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff;
    border-radius:6px;padding:3px 9px;font-size:10.5px;font-weight:600;cursor:pointer;font-family:'Calibri','Carlito',sans-serif;
  }
  .comms-cal-post-expand:hover{background:rgba(255,255,255,.3);}
  .comms-posts{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .comms-post-row{position:relative;border:1px solid var(--line);border-radius:8px;padding:10px 34px 10px 10px;background:#fff;}
  .comms-post-remove{position:absolute;top:8px;right:8px;border:none;background:none;color:var(--bad);cursor:pointer;font-size:14px;padding:4px 6px;}
  .comms-post-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .comms-post-grid .full{grid-column:1/3;}
  .comms-post-grid select,.comms-post-grid input{
    width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;
    background:#fff;color:var(--ink);font-family:'Calibri','Carlito',sans-serif;
  }
  .comms-platform-toggle{display:flex;gap:6px;}
  .comms-plat-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:20px;font-size:11.5px;
    padding:5px 11px;cursor:pointer;font-family:'Calibri','Carlito',sans-serif;font-weight:600;
  }
  .comms-plat-btn.on{background:var(--winter);color:#fff;border-color:transparent;}
  .comms-status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .comms-status-btn{
    border:1px solid var(--line);background:#fff;border-radius:20px;font-size:11px;padding:4px 11px;
    cursor:pointer;font-family:'Calibri','Carlito',sans-serif;font-weight:700;
  }
  .comms-add-post{
    align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:6px;padding:6px 12px;
    font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Calibri','Carlito',sans-serif;
  }
  .comms-add-post:hover{background:var(--paper);color:var(--ink);}

  /* ---------- PDF print export ---------- */
  .print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    .print-area, .print-area *{visibility:visible;}
    .print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:10px 20px;}
    .print-header{border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:16px;}
    .print-header h1{font-family:'Calibri','Carlito',sans-serif;font-size:20px;margin:0;color:var(--navy);}
    .print-header h2{font-family:'Calibri','Carlito',sans-serif;font-size:15px;margin:3px 0 0;color:var(--ink-soft);font-weight:400;}
    .print-table{width:100%;border-collapse:collapse;font-family:'Calibri','Carlito',sans-serif;font-size:12px;}
    .print-table th{text-align:left;border-bottom:2px solid var(--navy);padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
    .print-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
    .print-status{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
    .print-status.confirmed{color:#1E9E5C;}
    .print-status.pending{color:#E0A020;}
    .print-status.declined{color:#D9453D;}
    .print-footer{margin-top:16px;font-size:9px;color:var(--ink-soft);}
  }

  /* ---------- Week editor: compact rows, bottom-sheet add/edit, undo ---------- */
  .week-card.editing{flex-direction:column;gap:14px;}
  .week-card.editing .wc-edit-grid{width:100%;}
  .wc-edit-grid > div{min-width:0;}
  .wc-edit-grid input{font-size:16px;}
  .wc-edit-grid input[type="date"],.sheet input[type="date"],.sheet input[type="time"]{
    -webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left;min-height:42px;
  }
  .wc-edit-grid input[type="date"]::-webkit-date-and-time-value,.sheet input::-webkit-date-and-time-value{text-align:left;}
  .we-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%;}
  .we-menu-wrap{position:relative;flex-shrink:0;}
  .we-menu-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:20px;color:var(--ink-soft);line-height:1;}
  .we-menu-btn:hover{background:var(--paper);color:var(--ink);}
  .we-menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.14);z-index:6;min-width:190px;padding:4px;}
  .we-menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:12px 12px;font-size:14px;cursor:pointer;color:var(--bad);font-family:inherit;font-weight:700;border-radius:7px;}
  .we-menu button:hover{background:var(--bad-soft);}
  .we-section{border-top:1px solid var(--line);padding-top:8px;}
  .we-section-head{display:flex;justify-content:space-between;align-items:center;}
  .we-section-title{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .we-add{border:none;background:none;color:var(--navy);font-weight:700;font-size:15px;cursor:pointer;padding:10px 4px;font-family:inherit;}
  .we-add:hover{text-decoration:underline;}
  .we-empty{font-size:13px;color:var(--ink-soft);font-style:italic;padding:2px 0 6px;}
  .we-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;min-height:54px;}
  .we-rows .we-row:first-child{border-top:none;}
  @media (hover:hover){ .we-row:hover{background:var(--paper);} }
  .we-row.recurring{cursor:default;}
  @media (hover:hover){ .we-row.recurring:hover{background:none;} }
  .we-bar{width:5px;align-self:stretch;border-radius:3px;flex-shrink:0;}
  .we-body{flex:1;min-width:0;}
  .we-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .we-note{font-weight:400;color:var(--ink-soft);}
  .we-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .we-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 1px;}
  .we-rec-badge{font-size:10px;font-weight:700;color:var(--good);background:var(--good-soft);padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:2px;}
  .we-trash{border:none;background:none;color:var(--ink-soft);cursor:pointer;padding:10px;border-radius:8px;flex-shrink:0;display:flex;}
  .we-trash:hover{color:var(--bad);background:var(--bad-soft);}
  .we-chev{color:var(--ink-soft);font-size:20px;flex-shrink:0;line-height:1;}
  .we-footer{position:sticky;bottom:0;display:flex;gap:8px;background:#fff;border-top:1px solid var(--line);padding:10px 0 calc(6px + env(safe-area-inset-bottom));z-index:3;width:100%;}
  .we-footer .btn{flex:1;padding:13px 16px;font-size:15px;}
  .we-footer .btn.primary{flex:2;}

  .sheet-overlay{position:fixed;inset:0;background:rgba(22,15,61,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:10px 18px 0;-webkit-overflow-scrolling:touch;}
  @media (min-width:641px){ .sheet-overlay{align-items:center;padding:20px;} .sheet{border-radius:14px;} }
  .sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px;}
  .sheet h3{font-size:19px;margin:0 0 4px;}
  .sheet-field{margin-top:16px;}
  .sheet-label{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .sheet input[type="text"],.sheet select,.sheet input[type="date"],.sheet input[type="time"]{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .sheet-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .sheet-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink);display:inline-flex;align-items:center;gap:6px;}
  .sheet-chip .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .sheet-chip.on{border-color:var(--navy);background:var(--navy);color:#fff;}
  .sheet-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px;}
  .sheet-hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .sheet-link{border:none;background:none;padding:8px 0 0;color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;}
  .sheet-link.danger{color:var(--bad);font-weight:600;font-size:12.5px;}
  .sheet-error{color:var(--bad);font-size:13.5px;margin-top:6px;font-weight:600;}
  .sheet-actions{display:flex;gap:8px;margin-top:20px;position:sticky;bottom:0;background:#fff;padding:10px 0 calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .sheet-actions .btn{flex:1;padding:13px;font-size:15px;}
  .sheet-actions .btn.primary{flex:2;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:12px;cursor:pointer;}
  .toggle-row input{width:20px;height:20px;}
  .undo-toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));background:var(--ink);color:#fff;border-radius:10px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:14px;z-index:70;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.2);}
  .undo-toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .undo-toast button{background:none;border:none;color:var(--gold);font-weight:700;font-size:15px;cursor:pointer;padding:8px 10px;font-family:inherit;flex-shrink:0;}

  /* ---------- Dashboard: compact status-coloured week cards ---------- */
  .view-toggle{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .view-toggle button{white-space:nowrap;flex-shrink:0;}
  .dash-actions{display:flex;gap:8px;align-items:center;position:relative;}
  .dash-toolbar .dash-menu-btn{flex:0 0 46px;}
  .dash-menu-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:42px;height:38px;cursor:pointer;font-size:20px;color:var(--ink-soft);line-height:1;}
  .dash-menu-btn:hover{background:var(--paper);color:var(--ink);}
  .dash-menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.14);z-index:6;min-width:230px;padding:4px;}
  .dash-menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit;font-weight:600;border-radius:7px;}
  .dash-menu button:hover{background:var(--paper);}
  .status-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin:0 2px 10px;}
  .status-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
  .jump-now,.show-earlier{width:100%;border:1px dashed var(--line);background:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;margin-bottom:6px;}
  .jump-now{border-style:solid;}
  .jump-now:hover,.show-earlier:hover{background:var(--paper);}
  .dash-month{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 6px;}
  .dash-month-name{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .dash-month-count{font-size:12px;color:var(--ink-soft);}
  .wk2{display:flex;gap:14px;background:var(--paper-raised);border:1px solid var(--line);border-left:5px solid var(--term-color,var(--navy));border-radius:10px;padding:12px 12px 12px 14px;cursor:pointer;}
  @media (hover:hover){ .wk2:hover{border-color:var(--ink-soft);border-left-color:var(--term-color,var(--navy));} }
  .wk2:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  .wk2.now{border:2px solid var(--gold);border-left:5px solid var(--gold);}
  .wk2-date{width:46px;flex-shrink:0;text-align:center;border-right:1px solid var(--line);padding-right:12px;}
  .wk2-dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .wk2-num{font-size:26px;line-height:1.1;}
  .wk2-now{font-size:9.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .wk2-main{flex:1;min-width:0;}
  .wk2-title{font-size:16px;font-weight:700;line-height:1.25;}
  .wk2-title.untitled{color:var(--ink-soft);font-style:italic;font-weight:400;}

<script>
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const CATS = {
  'small-group':{label:'Small Group'},
  'prayer':{label:'Prayer Service'},
  'service':{label:'Service'},
  'event':{label:'Event'}
};
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Per-item status (midweek / post-service activities only — not the Sunday itself).
// Recurring-rhythm-generated instances always read as 'confirmed' since the status
// applies to a specific one-off booking, not the recurring template.
const STATUSES = {
  confirmed: {label:'Confirmed'},
  pending: {label:'Needs approval'},
  declined: {label:'Cancelled'}
};

// ---------- Comms Plan ----------
// Every comms post carries a status matching the church's existing content-calendar
// convention (Planned -> In progress -> Scheduled -> Posted), distinct from the
// week-item Confirmed/Pending/Cancelled status above — this tracks the comms work
// itself, not whether the underlying event is happening.
const COMMS_CHANNELS = {
  social: {label:'Social media', color:'var(--winter)'},
  email: {label:'Email', color:'var(--autumn)'},
  website_page: {label:'Website page', color:'var(--spring)'},
  website_banner: {label:'Website banner', color:'var(--summer)'},
  churchsuite: {label:'ChurchSuite ticket', color:'var(--navy)'},
  other: {label:'Other', color:'var(--ink-soft)'}
};
const COMMS_FORMATS = {post:'Post', reel:'Reel', story:'Story', link:'Link'};
const COMMS_PLATFORMS = {facebook:'Facebook', instagram:'Instagram'};
const COMMS_STATUSES = {
  planned: {label:'Planned', color:'var(--bad)', soft:'var(--bad-soft)'},
  in_progress: {label:'In progress', color:'var(--warn)', soft:'var(--warn-soft)'},
  scheduled: {label:'Scheduled', color:'var(--winter)', soft:'var(--winter-soft)'},
  posted: {label:'Posted', color:'var(--good)', soft:'var(--good-soft)'}
};
// Seeded once if no flows exist yet — the standard weekly cycle built around every
// Sunday, extracted from the church's existing social content calendar: a Friday
// teaser, Saturday reminder, Monday recap and Tuesday follow-up, each offset in days
// from that week's Sunday date. Auto-applied to every Sunday with no review needed;
// extra one-off posts (Easter, a new series, a standalone event) are added on top.
const DEFAULT_COMMS_FLOW = {name:'Sunday weekly rhythm', description:'Auto-applied to every Sunday: Friday teaser, Saturday reminder, Monday recap, Tuesday follow-up.'};
const DEFAULT_COMMS_FLOW_STEPS = [
  {dayOffset:-2, channel:'social', platform:'facebook,instagram', format:'reel', note:'Sunday teaser'},
  {dayOffset:-1, channel:'social', platform:'facebook,instagram', format:'story', note:'Sunday invite reminder'},
  {dayOffset:1, channel:'social', platform:'facebook,instagram', format:'post', note:'Sermon recap'},
  {dayOffset:2, channel:'social', platform:'facebook,instagram', format:'story', note:'Sermon links'}
];

// "Whole Church" tags stay tied to the church's own brand colour so they read as the dominant/default
// tag at a glance; every other audience gets a distinct colour from the palette below (or a custom

function audienceObj(name){ return state.audiences.find(a=>a.name===name); }
// Every audience's colour is stored and user-editable in Settings. If an audience was deleted or
// isn't found for some reason, fall back to a deterministic palette pick so it's still consistent.
function audienceColor(name){
  const a = audienceObj(name);
  if(a && a.color) return a.color;
  let h=0; const s=name||'';
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return TAG_PALETTE[h % TAG_PALETTE.length];
}

// (not fixed to the tag) — this resolves the effective audience for colouring and
// ChurchSuite category export: the item's own override if set, else the tag's own
// default audience, so nothing that predates this change breaks.
function itemAudience(m, tags){
  if(m.audience) return m.audience;

}

// Does a recurring rhythm template land on the given date, honouring frequency, interval and end conditions?
// (Outlook-style: Weekly/Monthly, "every N", and Never/After N occurrences/On a date.)
function rhythmAppliesToDate(r, date){
  const start = parseISO(r.startDate);
  if(date < start) return false;
  const freq = r.freq || 'weekly';
  const interval = Math.max(1, r.interval || 1);
  const endType = r.endType || (r.endDate ? 'byDate' : 'never');
  if(endType === 'byDate' && r.endDate && date > parseISO(r.endDate)) return false;

  let occurrenceIndex;
  if(freq === 'monthly'){
    const diffMonths = (date.getFullYear()-start.getFullYear())*12 + (date.getMonth()-start.getMonth());
    if(diffMonths < 0 || diffMonths % interval !== 0) return false;
    if(date.getDate() !== start.getDate()) return false;
    occurrenceIndex = diffMonths / interval;
  } else {
    const diffDays = Math.round((date - start)/(1000*60*60*24));
    if(diffDays < 0 || diffDays % (7*interval) !== 0) return false;
    occurrenceIndex = diffDays / (7*interval);
  }
  if(endType === 'after' && r.occurrenceCount && occurrenceIndex >= r.occurrenceCount) return false;
  return true;
}

// Merge recurring rhythm templates (minus this week's exclusions) with this week's own one-off midweek items.
// Each item now carries tagIds (can be more than one, e.g. Worship + Production) and its own actual
// date — recurring items derive theirs from the week's commencing date plus a day offset, one-off
// items can have any date picked directly.
function effectiveMidweek(wk){
  const items = [];
  const wkDate = wk.weekCommencing ? parseISO(wk.weekCommencing) : (wk.sundayDate ? parseISO(wk.sundayDate) : null);
  const excluded = wk.excludedRecurring || [];
  if(wkDate){
    state.recurringRhythms.forEach(r=>{
      if((r.slot||'midweek')!=='midweek') return;
      if(rhythmAppliesToDate(r, wkDate) && !excluded.includes(r.id)){
        const offset = r.dayOffset || 0;
        const actualDate = new Date(wkDate.getFullYear(), wkDate.getMonth(), wkDate.getDate()+offset);
        items.push({
          id:'rec-'+r.id+'-'+wk.id, tagIds:r.tagIds || (r.tagId?[r.tagId]:[]), note:r.note||'',
          recurringId:r.id, date:isoDate(actualDate)
        });
      }
    });
  }
  (wk.midweek||[]).forEach(m=> items.push({
    ...m,
    tagIds: m.tagIds || (m.tagId?[m.tagId]:[]),
    date: m.date || wk.weekCommencing
  }));
  return items;
}

// Same idea as effectiveMidweek, but anchored to the Sunday itself rather than the
// week-commencing Monday — for things happening after the service that day (or nearby).
function effectivePostService(wk){
  const items = [];
  const anchor = wk.sundayDate ? parseISO(wk.sundayDate) : null;
  const excluded = wk.excludedRecurring || [];
  if(anchor){
    state.recurringRhythms.forEach(r=>{
      if((r.slot||'midweek')!=='postService') return;
      if(rhythmAppliesToDate(r, anchor) && !excluded.includes(r.id)){
        const offset = r.dayOffset || 0;
        const actualDate = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate()+offset);
        items.push({
          id:'psrec-'+r.id+'-'+wk.id, tagIds:r.tagIds||[], note:r.note||'',
          recurringId:r.id, date:isoDate(actualDate)
        });
      }
    });
  }
  (wk.postService||[]).forEach(m=> items.push({
    ...m,
    tagIds: m.tagIds || [],
    date: m.date || wk.sundayDate
  }));
  return items;
}

// A "church year" runs Autumn -> Summer (e.g. church year 2026 = Sep 2026 through Aug 2027),
// starting with the Autumn term. None of the three terms below span a calendar year-end
// themselves — only the church year as a whole does, at the Aug/Sep boundary.
function churchYearOf(date){
  const m = date.getMonth(); // 0-11
  const y = date.getFullYear();
  return m>=8 ? y : y-1; // Sep-Dec belong to church year y; Jan-Aug belong to the church year that started the previous September
}

// Exact date range for a term within a specific, explicit church year (no "closest occurrence" guessing).
function termDateRangeForYear(termKey, churchYear){
  if(termKey==='autumn') return [new Date(churchYear,8,1), new Date(churchYear,11,31)];
  if(termKey==='spring') return [new Date(churchYear+1,0,1), new Date(churchYear+1,3,30)];
  return [new Date(churchYear+1,4,1), new Date(churchYear+1,7,31)]; // summer
}

function churchYearLabel(y){ return `${y}–${String(y+1).slice(2)}`; }

function allSundaysInRange(start, end){
  const out = [];
  let d = new Date(start);
  const offsetToSun = (7 - d.getDay()) % 7;
  d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (d.getDay()===0?0:offsetToSun));
  while(d <= end){
    out.push(new Date(d));
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate()+7);
  }
  return out;
}

function termOf(date){
  const m = date.getMonth(); // 0-11
  if([8,9,10,11].includes(m)) return 'autumn'; // Sep-Dec
  if([0,1,2,3].includes(m)) return 'spring';   // Jan-Apr
  return 'summer';                             // May-Aug
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  // fallback for older browsers without crypto.randomUUID
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function isoDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }

// Owner columns are only selected if they exist — so the app keeps working if the
// code is deployed before the owner ALTER TABLE statements have been run.
function loadWeeksQuery(withOwner){
  const o = withOwner ? ', owner' : '';
  return sb.from('weeks').select(`
      id, occasion, sunday_date, sunday_series, week_commencing, happening,
      week_midweek_items ( id, note, item_date, status, start_time, end_time, all_day, audience${o}, week_midweek_item_tags ( tag_id ) ),
      week_post_service_items ( id, note, item_date, status, start_time, end_time, all_day, audience${o}, week_post_service_item_tags ( tag_id ) ),
      week_excluded_recurring ( recurring_rhythm_id )
    `).order('sunday_date');
}
let ownerColumnsExist = true;
let tagOwnerColumnExists = true;

async function loadData(){
  let [usersRes, audRes, tagsRes, weeksRes, rrRes, evRes] = await Promise.all([
    sb.from('users').select('*'),
    sb.from('audiences').select('*'),
    sb.from('tags').select('*'),
    loadWeeksQuery(true),
    sb.from('recurring_rhythms').select(`
      id, note, start_date, end_date, freq, interval, end_type, occurrence_count, day_offset, slot,
      recurring_rhythm_tags ( tag_id )
    `),
    sb.from('events').select('*')
  ]);

  if(weeksRes.error && /owner/i.test(weeksRes.error.message||'')){
    console.warn('owner column missing — loading weeks without owners until the SQL is run');
    ownerColumnsExist = false;
    weeksRes = await loadWeeksQuery(false);
  } else if(!weeksRes.error){ ownerColumnsExist = true; }

  [usersRes, audRes, tagsRes, weeksRes, rrRes, evRes].forEach(r=>{
    if(r.error) console.error('Supabase load error:', r.error);
  });

  state.users = (usersRes.data||[]).map(u=>({id:u.id, name:u.name, pin:u.pin}));

  state.audiences = (audRes.data||[]).map(a=>({name:a.name, color:a.color}));
  if(!state.audiences.length){
    state.audiences = DEFAULT_AUDIENCES.map(a=>({...a}));
    await saveAudiences(state.audiences);
  }
  ['Core Team','Service Team'].forEach(name=>{
    if(!state.audiences.some(a=>a.name===name)){
      const def = DEFAULT_AUDIENCES.find(d=>d.name===name);
      const a = {name, color: def ? def.color : TAG_PALETTE[state.audiences.length % TAG_PALETTE.length]};
      state.audiences.push(a);
      saveAudiences(a);
    }
  });

  const ownersRes = await sb.from('owners').select('*');
  if(ownersRes.error){
    console.error('Supabase load error (owners):', ownersRes.error);
    state.ownersTableMissing = true;
    state.owners = DEFAULT_OWNERS.map((name,i)=>({name, sortOrder:i}));
  } else {
    state.ownersTableMissing = false;
    state.owners = (ownersRes.data||[]).map(o=>({name:o.name, sortOrder:o.sort_order||0})).sort((a,b)=>a.sortOrder-b.sortOrder);
    if(!state.owners.length){
      state.owners = DEFAULT_OWNERS.map((name,i)=>({name, sortOrder:i}));
      await saveOwners(state.owners);
    }
  }

  state.tags = (tagsRes.data||[]).map(t=>({id:t.id, name:t.name, audience:t.audience, defaultOwner:t.default_owner||''}));
  const tagOwnerCheck = await sb.from('tags').select('default_owner').limit(1);
  tagOwnerColumnExists = !tagOwnerCheck.error;
  if(!state.tags.length){
    state.tags = DEFAULT_TAGS.map(t=>({...t, id: uid()}));
    await saveTags(state.tags);
  }

  state.weeks = (weeksRes.data||[]).map(w=>({
    id: w.id,
    occasion: w.occasion || '',
    sundayDate: w.sunday_date,
    sundaySeries: w.sunday_series || '',
    weekCommencing: w.week_commencing,
    happening: w.happening || '',
    midweek: (w.week_midweek_items||[]).map(m=>({
      id: m.id, note: m.note||'', date: m.item_date, status: m.status||'confirmed',
      allDay: m.all_day!==false, startTime: m.start_time||'', endTime: m.end_time||'', audience: m.audience||'', owner: m.owner||'',
      tagIds: (m.week_midweek_item_tags||[]).map(t=>t.tag_id)
    })),
    postService: (w.week_post_service_items||[]).map(m=>({
      id: m.id, note: m.note||'', date: m.item_date, status: m.status||'confirmed',
      allDay: m.all_day!==false, startTime: m.start_time||'', endTime: m.end_time||'', audience: m.audience||'', owner: m.owner||'',
      tagIds: (m.week_post_service_item_tags||[]).map(t=>t.tag_id)
    })),
    excludedRecurring: (w.week_excluded_recurring||[]).map(e=>e.recurring_rhythm_id)
  }));
  state.weeks.sort((a,b)=> a.sundayDate < b.sundayDate ? -1 : 1);

  state.recurringRhythms = (rrRes.data||[]).map(r=>({
    id: r.id, note: r.note||'', startDate: r.start_date, endDate: r.end_date,
    freq: r.freq, interval: r.interval, endType: r.end_type, occurrenceCount: r.occurrence_count,
    dayOffset: r.day_offset||0, tagIds: (r.recurring_rhythm_tags||[]).map(t=>t.tag_id)
  }));

  state.events = (evRes.data||[]).map(e=>({
    id: e.id, title: e.title, category: e.category, date: e.event_date,
    recurrence: e.recurrence, recurrenceInterval: e.recurrence_interval,
    recurrenceEndType: e.recurrence_end_type, recurrenceCount: e.recurrence_count,
    recurrenceEnd: e.recurrence_end, notes: e.notes||'', createdBy: e.created_by
  }));

  // ---------- Comms Plan ----------
  const [flowsRes, stepsRes, plansRes, postsRes] = await Promise.all([
    sb.from('comms_flows').select('*'),
    sb.from('comms_flow_steps').select('*'),
    sb.from('comms_plans').select('*'),
    sb.from('comms_posts').select('*')
  ]);
  const commsLoadErrors = [];
  [['comms_flows',flowsRes],['comms_flow_steps',stepsRes],['comms_plans',plansRes],['comms_posts',postsRes]].forEach(([name,r])=>{
    if(r.error){ console.error('Supabase load error ('+name+'):', r.error); commsLoadErrors.push(name+': '+r.error.message); }
  });
  if(commsLoadErrors.length){
    alert('Could not load comms data:\n' + commsLoadErrors.join('\n') + '\n\nComms tab may appear empty until this is fixed.');
  }

  state.commsFlows = (flowsRes.data||[]).map(f=>({id:f.id, name:f.name, description:f.description||''}));
  state.commsFlowSteps = (stepsRes.data||[]).map(s=>({
    id:s.id, flowId:s.flow_id, dayOffset:s.day_offset, channel:s.channel,
    platform:s.platform||'', format:s.format||'', note:s.note||'', sortOrder:s.sort_order||0
  }));
  if(!state.commsFlows.length && !flowsRes.error){
    // Seed the default weekly Sunday flow once, the same way default tags/audiences are
    // seeded — but only when the table genuinely has no rows, not when the read itself
    // failed (re-seeding on a failed read would create duplicate/orphaned flows every reload).
    const flow = {id:uid(), ...DEFAULT_COMMS_FLOW};
    state.commsFlows = [flow];
    await saveCommsFlow(flow);
    const steps = DEFAULT_COMMS_FLOW_STEPS.map(s=>({id:uid(), flowId:flow.id, ...s, sortOrder:0}));
    state.commsFlowSteps = steps;
    await saveCommsFlowSteps(steps);
  } else if(state.commsFlows.length && !stepsRes.error){
    // Self-heal: a flow can exist with zero steps if an earlier save of the steps
    // failed (e.g. a permissions issue that's since been fixed) while the flow's own
    // save succeeded — that combination silently blocks the Sunday rhythm forever
    // otherwise, since a flow "existing" was the only condition checked above.
    const flow = state.commsFlows[0];
    const hasSteps = state.commsFlowSteps.some(s=>s.flowId===flow.id);
    if(!hasSteps){
      const steps = DEFAULT_COMMS_FLOW_STEPS.map(s=>({id:uid(), flowId:flow.id, ...s, sortOrder:0}));
      state.commsFlowSteps = state.commsFlowSteps.concat(steps);
      await saveCommsFlowSteps(steps);
    }
  }

  state.commsPlans = (plansRes.data||[]).map(p=>({
    id:p.id, itemType:p.item_type, itemRefId:p.item_ref_id, needsComms:p.needs_comms,
    autoFlowId:p.auto_flow_id, itemTitle:p.item_title||'', notes:p.notes||''
  }));
  state.commsPosts = (postsRes.data||[]).map(p=>({
    id:p.id, commsPlanId:p.comms_plan_id, channel:p.channel, platform:p.platform||'',
    format:p.format||'', postDate:p.post_date, endDate:p.end_date, note:p.note||'', status:p.status||'planned'
  }));

  state.loaded = true;
}

// ---------- Save / delete helpers ----------
// Each accepts a single item, an array, or nothing (meaning "everything currently
// in local state") — and only ever touches the rows it's given, upserting them.
// Deletions are always explicit, separate calls at the point of removal, so one
// person's edit can never silently wipe out another person's concurrent change.

async function saveUsers(userOrUsers){
  const rows = userOrUsers ? (Array.isArray(userOrUsers)?userOrUsers:[userOrUsers]) : state.users;
  const payload = rows.map(u=>({id:u.id, name:u.name, pin:u.pin}));
  const { error } = await sb.from('users').upsert(payload);
  if(error) console.error('save users failed', error);
}

async function saveTags(tagOrTags){
  const rows = tagOrTags ? (Array.isArray(tagOrTags)?tagOrTags:[tagOrTags]) : state.tags;
  const payload = rows.map(t=>({id:t.id, name:t.name, audience:t.audience, ...(tagOwnerColumnExists ? {default_owner: t.defaultOwner||null} : {})}));
  const { error } = await sb.from('tags').upsert(payload);
  if(error) console.error('save tags failed', error);
}
async function deleteTagRemote(id){
  const { error } = await sb.from('tags').delete().eq('id', id);
  if(error) console.error('delete tag failed', error);
}

async function saveAudiences(audOrAuds){
  const rows = audOrAuds ? (Array.isArray(audOrAuds)?audOrAuds:[audOrAuds]) : state.audiences;
  const payload = rows.map(a=>({name:a.name, color:a.color}));
  const { error } = await sb.from('audiences').upsert(payload, {onConflict:'name'});

      id:m.id, week_id:w.id, note:m.note||'', item_date:m.date||null, status:m.status||'confirmed',

    (w.postService||[]).forEach(m=> (m.tagIds||[]).forEach(tid=> psTagRows.push({post_service_item_id:m.id, tag_id:tid})));
    if(psTagRows.length){
      const { error: psTagErr } = await sb.from('week_post_service_item_tags').insert(psTagRows);

// ---------- Realtime: any change from any browser tab triggers a fresh reload ----------
let refreshTimer = null;
function scheduleRefresh(){
  // debounce — a single edit often touches 2-3 tables at once (e.g. a week plus its
  // midweek items and tags), so wait a moment for the burst to settle before refetching.
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async ()=>{
    await loadData();
    render();
  }, 400);
}
function subscribeRealtime(){
  const tables = [
    'users','audiences','tags','weeks','week_midweek_items','week_midweek_item_tags','week_post_service_items','week_post_service_item_tags',
    'recurring_rhythms','recurring_rhythm_tags','week_excluded_recurring','events',
    'comms_flows','comms_flow_steps','comms_plans','comms_posts','owners'
  ];
  const channel = sb.channel('planner-changes');
  tables.forEach(t=>{
    channel.on('postgres_changes', {event:'*', schema:'public', table:t}, scheduleRefresh);
  });
  channel.subscribe();
}


// ---------- Occurrence expansion for recurring items ----------
function occurrencesInRange(ev, rangeStart, rangeEnd){
  const out = [];
  const start = parseISO(ev.date);
  if(ev.recurrence === 'none'){
    if(start >= rangeStart && start <= rangeEnd) out.push(new Date(start));
    return out;
  }
  const interval = Math.max(1, ev.recurrenceInterval || 1);
  const endType = ev.recurrenceEndType || (ev.recurrenceEnd ? 'byDate' : 'never');
  const hardEnd = (endType==='byDate' && ev.recurrenceEnd) ? parseISO(ev.recurrenceEnd) : new Date(rangeEnd.getFullYear()+2,0,1);
  let cur = new Date(start);
  let idx = 0;
  let guard = 0;
  while(cur <= rangeEnd && cur <= hardEnd && guard < 400){
    if(endType==='after' && ev.recurrenceCount && idx >= ev.recurrenceCount) break;
    if(cur >= rangeStart && cur >= start) out.push(new Date(cur));
    if(ev.recurrence === 'daily') cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()+interval);
    else if(ev.recurrence === 'weekly') cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()+7*interval);
    else if(ev.recurrence === 'monthly') cur = new Date(cur.getFullYear(), cur.getMonth()+interval, cur.getDate());
    else break;
    idx++;
    guard++;
  }
  return out;
}

function eventsForRange(rangeStart, rangeEnd){
  const items = [];
  state.events.forEach(ev=>{
    const occ = occurrencesInRange(ev, rangeStart, rangeEnd);
    occ.forEach(d=>{
      if(state.termFilter && termOf(d) !== state.termFilter) return;
      if(state.catFilters.size && !state.catFilters.has(ev.category)) return;
      items.push({ev, date:d});
    });
  });
  state.weeks.forEach(wk=>{
    if(wk.sundayDate){
      const d = parseISO(wk.sundayDate);
      if(d >= rangeStart && d <= rangeEnd && (!state.termFilter || termOf(d)===state.termFilter)){
        const cat = 'service';
        if(!state.catFilters.size || state.catFilters.has(cat)){
          items.push({ev:{id:'wk-sun-'+wk.id, title:(wk.occasion||wk.sundaySeries||'Sunday'), category:cat, recurrence:'none', synthetic:true, weekId:wk.id, series:wk.sundaySeries||'', occasion:wk.occasion||''}, date:d});
        }
      }
    }
    if(wk.weekCommencing){
      const mw = effectiveMidweek(wk);
      mw.forEach(m=>{
        const itemDate = m.date ? parseISO(m.date) : parseISO(wk.weekCommencing);
        if(itemDate < rangeStart || itemDate > rangeEnd) return;
        if(state.termFilter && termOf(itemDate) !== state.termFilter) return;
        const tags = (m.tagIds||[]).map(tagById).filter(Boolean);
        if(!tags.length) return;
        const aud = itemAudience(m, tags);
        const title = tags.map(t=>t.name).join(' + ') + (m.note?' — '+m.note:'');
        items.push({ev:{
          id:'wk-mid-'+wk.id+'-'+m.id, title,
          category:'tag', color:audienceColor(aud), dominant:isDominantAudience(aud),
          tags: tags.map(t=>({name:t.name, color:audienceColor(aud), dominant:isDominantAudience(aud)})),
          audience: aud, recurrence:'none',
          synthetic:true, weekId:wk.id, status: m.status || 'confirmed',
          kind:'mid', name: tags.map(t=>t.name).join(' + '), note: m.note||'', recurring: !!m.recurringId,
          owner: effectiveOwner(m, tags),
          time: (m.allDay===false && m.startTime) ? m.startTime+(m.endTime?'–'+m.endTime:'') : ''
        }, date:itemDate});
      });
    }
    if(wk.sundayDate){
      const ps = effectivePostService(wk);
      ps.forEach(m=>{
        const itemDate = m.date ? parseISO(m.date) : parseISO(wk.sundayDate);
        if(itemDate < rangeStart || itemDate > rangeEnd) return;
        if(state.termFilter && termOf(itemDate) !== state.termFilter) return;
        const tags = (m.tagIds||[]).map(tagById).filter(Boolean);
        if(!tags.length) return;
        const aud = itemAudience(m, tags);
        const title = tags.map(t=>t.name).join(' + ') + (m.note?' — '+m.note:'');
        items.push({ev:{
          id:'wk-ps-'+wk.id+'-'+m.id, title,
          category:'tag', color:audienceColor(aud), dominant:isDominantAudience(aud),
          tags: tags.map(t=>({name:t.name, color:audienceColor(aud), dominant:isDominantAudience(aud)})),
          audience: aud, recurrence:'none',
          synthetic:true, weekId:wk.id, status: m.status || 'confirmed',
          kind:'ps', name: tags.map(t=>t.name).join(' + '), note: m.note||'', recurring: !!m.recurringId,
          owner: effectiveOwner(m, tags),
          time: (m.allDay===false && m.startTime) ? m.startTime+(m.endTime?'–'+m.endTime:'') : ''
        }, date:itemDate});
      });
    }
  });
  items.sort((a,b)=> a.date - b.date);
  return items;
}

// ---------- Comms Plan ----------
// Item type + a stable per-occurrence key are derived from the synthetic ids
// eventsForRange already produces, so no extra bookkeeping is needed elsewhere —
// a Sunday, midweek activity, post-service activity or event occurrence all get a
// unique, stable comms_plans.item_ref_id just from their existing id + date.
function commsItemType(ev){
  if(!ev.id) return null;
  if(ev.id.startsWith('wk-sun-')) return 'sunday';
  if(ev.id.startsWith('wk-mid-')) return 'midweek';
  if(ev.id.startsWith('wk-ps-')) return 'postService';
  if(!ev.synthetic) return 'event';
  return null;
}
const COMMS_TYPE_LABELS = {sunday:'Sunday', midweek:'Midweek', postService:'Post-service', event:'Event'};
function commsItemKey(o){ return o.ev.id + '::' + isoDate(o.date); }

// Comms items are independent of whatever Calendar/List filters happen to be set —
// temporarily clear them so a leftover category filter can't silently hide items
// from review.
function commsItemsForRange(rangeStart, rangeEnd){
  const savedTerm = state.termFilter, savedCats = state.catFilters;
  state.termFilter = null; state.catFilters = new Set();
  const occ = eventsForRange(rangeStart, rangeEnd);
  state.termFilter = savedTerm; state.catFilters = savedCats;
  return occ.filter(o=> !!commsItemType(o.ev));
}

function commsPlanFor(o){ return state.commsPlans.find(p=>p.itemRefId===commsItemKey(o)); }
function commsPostsFor(planId){ return state.commsPosts.filter(p=>p.commsPlanId===planId).sort((a,b)=> a.postDate<b.postDate?-1:1); }

// Auto-applies the default Sunday flow to any Sunday in range that doesn't have a
// comms plan yet — no Needs comms? question asked, matching the agreed design.
// Also backfills posts for a Sunday that already has an auto-flow plan but no posts
// yet — this covers plans created before the flow's steps existed (exactly what
// happened here: the plan saved, the steps didn't, until fixed), so it self-heals
// rather than staying permanently empty just because a plan row exists.
// Mutates state synchronously so the same render pass reflects it; the Supabase
// writes happen in the background and reconcile via the item_ref_id unique constraint
// if two people open the tab for the same week at once.
function ensureAutoCommsForSundays(items){
  const defaultFlow = state.commsFlows[0];
  if(!defaultFlow) return;
  const steps = state.commsFlowSteps.filter(s=>s.flowId===defaultFlow.id);
  if(!steps.length) return;
  const newPlans = [], newPosts = [];
  items.forEach(o=>{
    if(commsItemType(o.ev)!=='sunday') return;
    const key = commsItemKey(o);
    let plan = state.commsPlans.find(p=>p.itemRefId===key);
    if(!plan){
      plan = {id:uid(), itemType:'sunday', itemRefId:key, needsComms:true, autoFlowId:defaultFlow.id, itemTitle:o.ev.title, notes:''};
      state.commsPlans.push(plan);
      newPlans.push(plan);
    }
    if(!plan.autoFlowId) return; // manually-decided plan, not an auto-flow one — leave it alone
    const hasPosts = state.commsPosts.some(p=>p.commsPlanId===plan.id);
    if(hasPosts) return;
    steps.forEach(s=>{
      const d = new Date(o.date.getFullYear(), o.date.getMonth(), o.date.getDate()+s.dayOffset);
      const post = {id:uid(), commsPlanId:plan.id, channel:s.channel, platform:s.platform, format:s.format, postDate:isoDate(d), endDate:null, note:s.note, status:'planned'};
      state.commsPosts.push(post);
      newPosts.push(post);
    });
  });
  if(newPlans.length) saveCommsPlan(newPlans, {ignoreDuplicates:true});
  if(newPosts.length) saveCommsPost(newPosts);
}

// ---------- Comms: Weeks + Calendar ----------
// Posts are grouped by the week they're POSTED in (Sun–Sat), so each week card is
// a to-do list for that week. Decisions ("needs comms?") sit in the week of the
// item itself. Standalone comms (things not in the other tabs, e.g. "Alpha")
// are plans with item_ref_id "standalone::<uuid>" — stored with item_type 'event'
// so no schema change is needed. Every view reads the same state, and every write
// is field-level and checked first, so changes show everywhere and never clobber
// someone else's edit.
const COMMS_STATUS_ORDER = ['planned','in_progress','scheduled','posted'];
const COMMS_STATUS_STYLE = {
  planned:{bar:'var(--tl-red)', bg:'var(--tl-red-soft)', fg:'#A12C26'},
  in_progress:{bar:'var(--tl-amber)', bg:'var(--tl-amber-soft)', fg:'#7A4E00'},
  scheduled:{bar:'#378ADD', bg:'#E6F1FB', fg:'#185FA5'},
  posted:{bar:'var(--tl-green)', bg:'var(--tl-green-soft)', fg:'#146B3E'}
};
const isStandalonePlan = p => p && (p.itemRefId||'').startsWith('standalone::');
function sundayOnOrBefore(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()); }
function commsChanLabel(p){
  if(p.channel==='social'){
    const plats = (p.platform||'').split(',').filter(Boolean).map(x=>x==='instagram'?'IG':x==='facebook'?'FB':x);
    return (plats.join('+') || 'Social') + (p.format ? ' '+(COMMS_FORMATS[p.format]||p.format) : '');
  }
  return (COMMS_CHANNELS[p.channel]||{label:p.channel}).label;
}
function commsForLabel(plan){
  if(!plan) return '';
  if(isStandalonePlan(plan)) return plan.itemTitle || 'Standalone';
  const iso = (plan.itemRefId||'').split('::')[1];
  return (plan.itemTitle || 'Item') + (iso ? ' · '+fmtDate(iso) : '');
}
function commsPostPasses(p){
  if(state.commsStatusFilter && state.commsStatusFilter!=='all' && (p.status||'planned')!==state.commsStatusFilter) return false;
  if(state.commsChannelFilter && p.channel!==state.commsChannelFilter) return false;
  return true;
}
function commsFiltering(){ return (state.commsStatusFilter && state.commsStatusFilter!=='all') || !!state.commsChannelFilter; }
// visible posts = posts whose plan still exists and still needs comms
function liveCommsPosts(){
  const plans = {}; state.commsPlans.forEach(p=> plans[p.id]=p);
  return state.commsPosts.filter(p=> p.postDate && plans[p.commsPlanId] && plans[p.commsPlanId].needsComms!==false);
}

function commsStatusPill(p){
  const s = p.status||'planned', st = COMMS_STATUS_STYLE[s];
  return `<button type="button" class="cm-st" data-post-id="${p.id}" title="Tap to move to the next status" style="background:${st.bg};color:${st.fg};border-color:${st.bar};">${COMMS_STATUSES[s].label}</button>`;
}
function commsPostRow(p, showDate){
  const plan = state.commsPlans.find(x=>x.id===p.commsPlanId);

      <span class="cm-post-for">for ${escHTML(commsForLabel(plan))}${isStandalonePlan(plan)?' <i>(standalone)</i>':''}${p.endDate?' · until '+fmtDate(p.endDate):''}</span>
    </span>

}

function commsFiltersHTML(){
  const f = state.commsStatusFilter || 'all';
  return `<div class="cal-filters">
    <button type="button" class="cal-chip cm-filter ${f==='all'?'on':''}" data-status="all">All</button>
    ${COMMS_STATUS_ORDER.map(k=>`<button type="button" class="cal-chip cm-filter ${f===k?'on':''}" data-status="${k}"><span class="cal-dot" style="background:${COMMS_STATUS_STYLE[k].bar};"></span>${COMMS_STATUSES[k].label}</button>`).join('')}
    <select id="cm-channel" aria-label="Filter by channel">
      <option value="">All channels</option>
      ${Object.entries(COMMS_CHANNELS).map(([k,v])=>`<option value="${k}" ${state.commsChannelFilter===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
    ${commsFiltering() ? `<button type="button" class="cal-clear" id="cm-clear">Clear</button>` : ''}
  </div>`;
}

function commsWeeksHTML(){
  const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
  const monthEnd = new Date(y, m+1, 0);
  let S = sundayOnOrBefore(new Date(y, m, 1));
  const posts = liveCommsPosts();
  const filtering = commsFiltering();
  const today = isoDate(new Date());
  let html = '';
  while(S <= monthEnd){
    const sIso = isoDate(S), eIso = addDaysISO(sIso, 6);
    const wk = state.weeks.find(w=>w.sundayDate===sIso);
    const items = commsItemsForRange(S, parseISO(eIso)).filter(o=> commsItemType(o.ev)!=='sunday');
    const decisions = [], waiting = [], noComms = [];
    items.forEach(o=>{
      const plan = commsPlanFor(o);
      if(!plan || plan.needsComms==null) decisions.push(o);
      else if(plan.needsComms===false) noComms.push({o, plan});
      else if(!posts.some(p=>p.commsPlanId===plan.id)) waiting.push({o, plan});
    });
    const weekPosts = posts.filter(p=> p.postDate>=sIso && p.postDate<=eIso).sort((a,b)=> a.postDate<b.postDate?-1:a.postDate>b.postDate?1:0);
    const shown = weekPosts.filter(commsPostPasses);
    if(filtering && !shown.length){ S = new Date(S.getFullYear(), S.getMonth(), S.getDate()+7); continue; }
    const notStarted = weekPosts.filter(p=>(p.status||'planned')==='planned').length;
    const inProg = weekPosts.filter(p=>p.status==='in_progress').length;
    const isNow = today>=sIso && today<=eIso;
    const showNo = state.commsShowNoComms === sIso;
    html += `<div class="la-week cm-week${isNow?' now':''}">
      <div class="cm-whead">
        <div class="la-wdate"><span>Sun</span><b>${S.getDate()}</b></div>
        <div class="la-whead-main">
          <div class="la-wtitle">${escHTML(wk && wk.sundaySeries ? wk.sundaySeries : 'Week of '+fmtDate(sIso))}</div>
          <div class="la-wsum">${isNow?'<b class="la-now">This week</b> · ':''}${fmtDate(sIso)} – ${fmtDate(eIso)} · ${weekPosts.length} post${weekPosts.length===1?'':'s'}${notStarted?` · <b class="la-red">${notStarted} not started</b>`:''}${inProg?` · <b class="la-amber">${inProg} in progress</b>`:''}</div>
        </div>
        <button type="button" class="btn cm-add" data-week="${sIso}">+ Add</button>
      </div>
      ${(!filtering && (decisions.length || waiting.length)) ? `<div class="cm-sec">
        <div class="cm-sec-label">Needs a decision</div>
        ${decisions.map(o=>{
          const type = commsItemType(o.ev);
          return `<div class="cm-dec">
            <span class="cm-dec-name">${escHTML(o.ev.name || o.ev.title)} <span class="cm-dec-meta">· ${fmtDate(isoDate(o.date))}</span></span>
            <button type="button" class="btn cm-no" data-key="${commsItemKey(o)}" data-itemtype="${type}" data-title="${escHTML(o.ev.name||o.ev.title)}">No comms</button>
            <button type="button" class="btn primary cm-yes" data-key="${commsItemKey(o)}" data-itemtype="${type}" data-title="${escHTML(o.ev.name||o.ev.title)}" data-week="${sIso}">Needs comms</button>
          </div>`;
        }).join('')}
        ${waiting.map(({o, plan})=>`<div class="cm-dec">
            <span class="cm-dec-name">${escHTML(o.ev.name || o.ev.title)} <span class="cm-dec-meta">· needs comms, no posts yet</span></span>
            <button type="button" class="btn cm-add" data-week="${sIso}" data-plan="${plan.id}">+ Add post</button>
          </div>`).join('')}
      </div>` : ''}
      <div class="cm-posts">${shown.length ? shown.map(p=>commsPostRow(p, true)).join('') : `<div class="la-empty" style="border:none;padding-left:0;">No posts this week</div>`}</div>
      ${(!filtering && noComms.length) ? `<div class="cm-nocomms">
        <button type="button" class="cm-link cm-toggle-no" data-week="${sIso}">${noComms.length} item${noComms.length===1?'':'s'} marked no comms · ${showNo?'hide':'show'}</button>
        ${showNo ? noComms.map(({o, plan})=>`<div class="cm-dec"><span class="cm-dec-name">${escHTML(o.ev.name||o.ev.title)} <span class="cm-dec-meta">· ${fmtDate(isoDate(o.date))}</span></span><button type="button" class="btn cm-undo-no" data-plan="${plan.id}">Undo</button></div>`).join('') : ''}
      </div>` : ''}
    </div>`;
    S = new Date(S.getFullYear(), S.getMonth(), S.getDate()+7);
  }
  return html || `<div class="empty">Nothing matches this filter in ${MONTHS[m]}.</div>`;
}

function commsCalendarGridHTML(){

  const weeks = Math.ceil((offset + daysInMonth)/7), gridStart = new Date(y, m, 1-offset);
  const cells = []; for(let i=0;i<weeks*7;i++) cells.push(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i));

  liveCommsPosts().filter(commsPostPasses).forEach(p=> (byDay[p.postDate]=byDay[p.postDate]||[]).push(p));

function commsForOptions(weekIso){
  const S = parseISO(weekIso);
  const items = commsItemsForRange(new Date(S.getFullYear(), S.getMonth(), S.getDate()-7), new Date(S.getFullYear(), S.getMonth(), S.getDate()+20));
  const seen = new Set();
  const opts = [];
  items.forEach(o=>{
    const key = commsItemKey(o);
    if(seen.has(key)) return; seen.add(key);
    const plan = commsPlanFor(o);
    if(plan && plan.needsComms===false) return;
    opts.push({value: plan ? 'plan:'+plan.id : 'item:'+key, label:`${o.ev.name||o.ev.title} · ${fmtDate(isoDate(o.date))}`, key, type:commsItemType(o.ev), title:o.ev.name||o.ev.title});
  });
  state.commsPlans.filter(isStandalonePlan).sort((a,b)=>(a.itemTitle||'').localeCompare(b.itemTitle||'')).forEach(p=>{
    opts.push({value:'plan:'+p.id, label:`${p.itemTitle||'Standalone'} (standalone)`});
  });
  return opts;
}
